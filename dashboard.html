<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0a0c10;color:#fff;min-height:100vh;padding-bottom:90px}
.header{padding:20px;display:flex;justify-content:space-between;align-items:center}
.card{background:#151821;border:1px solid #1e222f;border-radius:20px;padding:16px;margin:0 16px 12px 16px}
#sosBtn{width:100%;height:180px;border-radius:24px;border:0;background:linear-gradient(180deg,#ff3b30,#991b1b);color:#fff;font-size:30px;font-weight:900;box-shadow:0 12px 40px #ff3b3044}
#sosBtn:active{transform:scale(.97)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#151821;border-top:1px solid #1e222f;display:flex;padding:12px 0 28px 0;max-width:500px;margin:0 auto}
.nav-item{flex:1;text-align:center;color:#6b7280;font-size:11px;font-weight:700}
.nav-item.active{color:#22c55e}
.log{font-family:monospace;font-size:11px;background:#0a0c10;border-radius:10px;padding:8px;height:100px;overflow-y:auto;margin-top:8px}
</style>
</head>
<body>
<div class="header"><b>🆘 ZONDI</b><span style="font-size:12px;background:#1e222f;padding:6px 10px;border-radius:20px">{{ user.username }}</span></div>

<div class="card" style="text-align:center">
  <button id="sosBtn" onclick="sendSOS()">🚨<br>SOS</button>
  <input id="msg" placeholder="What happened? (optional)" style="width:100%;margin-top:12px;padding:12px;border-radius:12px;background:#0a0c10;border:1px solid #1e222f;color:#fff">
  <div id="status" style="margin-top:10px;font-size:13px;color:#6b7280"></div>
</div>

<div class="card">
  <b>📻 CH1 Ga-Rankuwa - Listening</b>
  <div id="radioLog" class="log"></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active">🚨<br>SOS</div>
  <div class="nav-item">📻<br>Radio</div>
  <div class="nav-item" onclick="location.href='/logout'">👤<br>Logout</div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let lastPos=null;
navigator.geolocation.watchPosition(p=>{lastPos=p},()=>{},{enableHighAccuracy:true});
async function sendSOS(){
  if(!lastPos) return alert('Allow location first');
  const res=await fetch('/api/send-otp',{method:'POST'}); // you can replace with /panic
  // Use your existing panic_alert socket
  socket.emit('panic_alert',{username:'{{ user.username }}',lat:lastPos.coords.latitude,lng:lastPos.coords.longitude});
  document.getElementById('status').textContent='✅ SOS SENT - Patrollers alerted on map!';
}
const socket=io();
socket.on('audio_chunk',d=>{ new Audio(d.audio).play(); document.getElementById('radioLog').innerHTML+=`<div>🔊 ${d.username} talking</div>`; });
</script>
</body>
</html>
