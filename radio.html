<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:15px}button{padding:14px;border-radius:10px;border:0;font-weight:bold}#rec{background:#ef4444;color:#fff}#presence{background:#1e293b;padding:10px;border-radius:10px;margin-top:10px}</style></head><body><h2>📻 Patrol Radio</h2><div id="presence">Loading...</div><button id="rec">Hold to Talk (press)</button><div id="feed"></div>
<script>
let t=localStorage.getItem('zondi_token'),recorder,chunks=[];async function load(){let r=await fetch('/api/radio/feed',{headers:{Authorization:'Bearer '+t}});let j=await r.json();presence.innerHTML='Connected: '+j.presence.length+'<br>'+j.presence.map(p=>p.name+(p.tx?' 🔴 TX':'')).join(', ');feed.innerHTML=j.items.map(i=>`<div><b>${i.name}</b> <audio controls src="${i.url}"></audio></div>`).reverse().join('');}
rec.onmousedown=async()=>{let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{let b=new Blob(chunks,{type:'audio/webm'});let fd=new FormData();fd.append('audio',b,'radio.webm');await fetch('/api/radio/push',{method:'POST',headers:{Authorization:'Bearer '+t},body:fd});load();};recorder.start();rec.textContent='Recording...';fetch('/api/radio/presence',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({tx:true})});};
rec.onmouseup=()=>{if(recorder){recorder.stop();rec.textContent='Hold to Talk (press)';}};
setInterval(load,3000);load();setInterval(()=>{fetch('/api/radio/presence',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({})})},5000);
</script></body></html>
