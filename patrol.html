<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Patrol Portal</title>
<link rel="stylesheet" href="/assets/zondi-theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/"><span class="brand-mark"><img src="/assets/zondi-logo.png"></span><span><div class="brand-title">ZONDI</div><div class="brand-sub">PATROL PORTAL</div></span></a>
<div class="row"><a class="btn" href="/radio">📻 Radio Net</a><button class="btn" id="logout">Sign out</button></div>
</div></header>
<main class="shell">
<div class="quicknav"><a class="btn" href="/patrol">👮 Patrol Home</a><a class="btn" href="/">Zondi Home</a></div>
<div id="status" class="status hidden" style="margin-top:12px"></div>

<section class="grid12" style="margin-top:12px">
<div class="panel panel-pad span8" style="height:520px;display:flex;flex-direction:column">
<div class="row-between"><b>Live Client Map</b><span class="badge live" id="clientCount">0 CLIENTS</span></div>
<div id="map" style="flex:1;border-radius:14px;margin-top:10px;min-height:380px"></div>
</div>
<div class="panel panel-pad span4" style="height:520px;overflow:auto">
<div class="row-between"><b>SOS Feed</b><button class="btn small" id="clearSos">Clear</button></div>
<div id="sosFeed" style="margin-top:10px"></div>
<div class="notice" style="margin-top:12px">SOS appears instantly. Click to fly to client.</div>
</div>
</section>
<footer class="footer">ZONDI PATROL SERVICE · <span class="gold">Designed by G.V Mkhwanazi™</span></footer>
</main>
<script>
const getToken=()=>localStorage.getItem('zondi_token')||sessionStorage.getItem('zondi_token');
const getUser=()=>{try{return JSON.parse(localStorage.getItem('zondi_user')||sessionStorage.getItem('zondi_user'))}catch{return null}};
const $=id=>document.getElementById(id);
function auth(){const t=getToken();return t?{Authorization:'Bearer '+t}:{}}
function msg(t,c=''){let s=$('status');s.hidden=false;s.textContent=t;s.className='status '+c}
(function authorize(){
  const token=getToken();const user=getUser();
  if(!token||!user){location.href='/login';return;}
  if(user.role!=='patroller'&&user.role!=='dev'){location.href='/clients';return;}
  fetch('/api/me',{headers:auth()}).then(r=>r.json()).then(j=>{if(!j.ok){localStorage.clear();sessionStorage.clear();location.href='/login';}});
})();
const map=L.map('map').setView([-29.0,26.0],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
let markers={};
async function loadLive(){
  try{
    const r=await fetch('/api/location/live',{headers:auth()});
    const d=await r.json();
    if(!d.ok) return;
    $('clientCount').textContent=d.locations.length+' CLIENTS';
    const seen=new Set();
    d.locations.forEach(loc=>{
      seen.add(loc.email);
      if(!markers[loc.email]){
        markers[loc.email]=L.marker([loc.lat,loc.lng]).addTo(map).bindPopup(loc.name||loc.email);
      }else markers[loc.email].setLatLng([loc.lat,loc.lng]);
    });
    Object.keys(markers).forEach(k=>{if(!seen.has(k)){map.removeLayer(markers[k]);delete markers[k];}});
  }catch{}
}
async function loadSos(){
  try{
    const r=await fetch('/api/sos-feed',{headers:auth()});
    const items=await r.json();
    $('sosFeed').innerHTML=items.slice(-10).reverse().map(s=>`
      <div class="notice sos-item" style="cursor:pointer;margin-bottom:8px" onclick="fly(${s.lat},${s.lng})">
        <b>${s.name||s.email}</b> — SOS<br><span class="mini">${new Date(s.time*1000).toLocaleTimeString()} · ${s.lat?.toFixed?.(4)||''}, ${s.lng?.toFixed?.(4)||''}</span>
      </div>`).join('')||'<div class="mini">No SOS yet.</div>';
  }catch{}
}
window.fly=(lat,lng)=>{ if(lat&&lng) map.flyTo([lat,lng],16); };
$('clearSos').onclick=()=>$('sosFeed').innerHTML='<div class="mini">Cleared locally.</div>';
setInterval(loadLive,4000);
setInterval(loadSos,3000);
loadLive(); loadSos();
$('logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST',headers:auth()})}catch{}localStorage.clear();sessionStorage.clear();location.href='/login';};
</script>
</body>
</html>
