<!DOCTYPE html><html><head><title>Patrol OS LIVE</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;min-height:100vh}
.phone{max-width:420px;margin:0 auto;min-height:100vh;background:#38bdf8;position:relative;display:flex;flex-direction:column}
.nav{padding:10px 14px;background:rgba(0,0,0,.2);color:#fff;display:flex;justify-content:space-between;align-items:center}
.grid{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.app{text-align:center;cursor:pointer}
.app.ico{width:64px;height:64px;margin:0 auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.app span{font-size:10px;font-weight:700;color:#fff;display:block;margin-top:5px}
.win{position:absolute;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
.win.open{display:flex}
.win-h{padding:10px 12px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center}
#map{flex:1;min-height:420px;position:relative}
.live-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1} 50%{opacity:0.3}}
.trace-dot{width:10px;height:10px;background:#3b82f6;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.map-tools{position:absolute;top:10px;right:10px;z-index:400;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:36px;height:36px;border:0;border-radius:8px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:18px;cursor:pointer}
.search-bar{display:flex;gap:6px;padding:8px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.search-bar input{flex:1;padding:8px 12px;border-radius:20px;border:1px solid #cbd5e1;font-size:12px}
.legend{position:absolute;bottom:10px;left:10px;z-index:400;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 10px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:11px;max-width:170px;max-height:140px;overflow-y:auto}
.legend b{display:block;margin-bottom:4px}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.legend-dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
</style></head><body>

</div>
<script>
let map = L.map('map',{zoomControl:false}).setView([-25.60215,27.9799],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function closeWin(){document.querySelectorAll('.win').forEach(w=>w.classList.remove('open'));}
function clearTrails(){ Object.values(clientDots).forEach(arr=>arr.forEach(d=>{ try{map.removeLayer(d)}catch(e){} })); Object.values(clientTrails).forEach(t=>t.setLatLngs([])); Object.keys(clientDots).forEach(k=>clientDots[k]=[]); Object.keys(clientHistories).forEach(k=>clientHistories[k]=[]); }
