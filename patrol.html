<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Radio</title><link rel="stylesheet" href="__CSS__"><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/patrol"><span class="brand-mark"><img src="__LOGO__" alt=""></span><span><div class="brand-title">ZONDI</div><div class="brand-sub">SECURITY RADIO</div></span></a><a class="btn" href="/patrol">← Patrol</a></div></header>
<main class="shell"><section class="panel panel-pad" style="max-width:720px;margin:18px auto"><div class="row-between"><div><b style="font-size:19px">Push-to-talk</b><div class="mini">One approved patroller transmits at a time.</div></div><span class="badge live" id="status">Connecting…</span></div>
<div class="row" style="margin-top:16px"><label class="mini">Channel</label><select id="channel" style="background:#0b0b09;color:#fff;border:1px solid var(--line);padding:10px;border-radius:11px"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<button id="ptt" class="btn primary block" style="margin-top:18px;min-height:150px;border-radius:28px;font-size:24px">HOLD TO TALK</button>
<div class="notice" style="margin-top:14px">Keep the button pressed while speaking. Release to open the channel for the next patroller.</div><div id="feed" class="list" style="margin-top:14px"></div></section>
<footer class="footer">ZONDI RADIO · <span class="gold">Designed by G.V Mkhwanazi™</span></footer></main>
<script>
const token=sessionStorage.getItem('zondi_token'),u=JSON.parse(sessionStorage.getItem('zondi_user')||'null');if(!token||!u||u.role!=='patroller')location.href='/login';const $=id=>document.getElementById(id);const socket=io({auth:{token}});let talking=false,rec=null;
socket.on('connect',()=>{ $('status').textContent='Online';socket.emit('join_channel',{channel:$('channel').value,auth:{token}})});socket.on('disconnect',()=>$('status').textContent='Offline');socket.on('channel_busy',x=>$('status').textContent='Channel busy: '+x.busy_by);socket.on('ptt_started',x=>$('status').textContent=(x.name||x.email)+' is transmitting…');socket.on('ptt_ended',()=>$('status').textContent='Channel clear.');socket.on('ptt_denied',x=>$('status').textContent=x.reason||'Denied');socket.on('audio_chunk',x=>{if(!x.audio)return;new Audio(x.audio).play().catch(()=>{});$('feed').insertAdjacentHTML('afterbegin',`<div class="item">🔊 ${String(x.name||x.email||'Patroller').replace(/[&<>]/g,'')}</div>`)});$('channel').onchange=()=>socket.emit('join_channel',{channel:$('channel').value,auth:{token}});
$('ptt').onpointerdown=async()=>{if(talking)return;talking=true;socket.emit('ptt_start',{channel:$('channel').value,auth:{token}});try{let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);rec.ondataavailable=e=>{if(e.data.size){let f=new FileReader();f.onload=()=>socket.emit('ptt_audio',{channel:$('channel').value,auth:{token},audio:f.result});f.readAsDataURL(e.data)}};rec.start(300);$('ptt').textContent='RELEASE TO STOP'}catch{$('status').textContent='Microphone permission required';end()}};function end(){if(!talking)return;talking=false;if(rec){rec.stop();rec.stream.getTracks().forEach(t=>t.stop());rec=null}socket.emit('ptt_end',{channel:$('channel').value,auth:{token}});$('ptt').textContent='HOLD TO TALK'}$('ptt').onpointerup=end;$('ptt').onpointerleave=e=>{if(talking&&e.buttons===0)end()};
</script></body></html>
