<!DOCTYPE html><html><head>
<title>Patrollers Portal - Zondi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:system-ui;margin:0;background:#f8fafc}.nav{padding:12px 20px;display:flex;justify-content:space-between;background:#0f172a;color:#fff;position:sticky;top:0;z-index:10}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px}#map{height:520px;border-radius:10px}</style>
</head><body>
<script>
let auth = JSON.parse(localStorage.getItem('zondi_auth')||'null');
if(!auth){ location.href='/login'; }
if(auth.role!=='patroller'){ alert('You are Client - going to Clients Portal'); location.href='/clients'; }
</script>

<div class="nav">
<div><b>PATROLLERS PORTAL</b><br><span style="font-size:10px;color:#94a3b8" id="guardEmail">Guard</span></div>
<div style="display:flex;gap:8px;align-items:center"><span style="font-size:10px;background:#16a34a;padding:3px 8px;border-radius:10px">● LIVE TRACE ALL CLIENTS</span><button onclick="localStorage.removeItem('zondi_auth');location.href='/login'" style="font-size:11px;padding:4px 10px;border-radius:20px;border:0;background:#fff">Logout</button></div>
</div>

<div style="padding:12px;max-width:1200px;margin:auto">
<div style="display:grid;grid-template-columns:1fr 320px;gap:12px">
<div class="card">
<div style="display:flex;justify-content:space-between;margin-bottom:6px"><b id="mapTitle">Trace ALL Clients - Satellite shows houses</b><select id="layerSelect" style="padding:4px 8px;border-radius:8px;font-size:12px"><option value="satellite">Satellite (see houses)</option><option value="topo">Topographic</option><option value="street">Street</option></select></div>
<div id="map"></div>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div class="card"><h4 style="margin:0">🚨 Live SOS from Clients (click to trace)</h4><div id="sosFeed" style="font-size:12px;max-height:240px;overflow-y:auto;margin-top:6px">Loading...</div></div>
<div class="card"><h4 style="margin:0">📱 All Clients Shops (Patroller sees all)</h4><div id="clientList" style="font-size:12px;margin-top:6px"></div><div id="trailBox" style="margin-top:8px;font-size:11px;background:#f8fafc;padding:6px;border-radius:8px">Select client to trace blue line</div></div>
<div class="card"><h4 style="margin:0">🎙️ T780 PTT</h4><button id="pttBtn" style="width:100%;margin-top:8px;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700">🎙️ HOLD TO TALK TO ALL RADIOS</button></div>
</div>
</div>
</div>

<script>
document.getElementById('guardEmail').innerText = auth.email + ' • PATROLLER';
let map = L.map('map').setView([-25.6242,28.0038],16);
let street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
let topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
let cur=sat;
document.getElementById('layerSelect').onchange=e=>{map.removeLayer(cur); cur=e.target.value=='satellite'?sat.addTo(map):e.target.value=='topo'?topo.addTo(map):street.addTo(map);};
let markers={}; let poly=null;
function loadSOS(){
 fetch('/api/sos-feed').then(r=>r.json()).then(list=>{
  let uniq={}; list.forEach(e=>{if(e.phoneId) uniq[e.phoneId]=e});
  document.getElementById('sosFeed').innerHTML=list.slice(-15).reverse().map(e=>`<div onclick="traceClient('${e.phoneId}')" style="padding:6px;border-bottom:1px solid #eee;cursor:pointer"><b style="color:#e11d48">${e.type}</b> ${e.phoneId}<br><span style="color:#666">${e.time?.slice(11,19)} ${e.lat?.toFixed(4)||''}</span></div>`).join('')||'No SOS';
  document.getElementById('clientList').innerHTML=Object.values(uniq).map(e=>`<div onclick="traceClient('${e.phoneId}')" style="padding:8px;border:1px solid #eee;border-radius:8px;margin-bottom:4px;cursor:pointer;background:${e.type.includes('SOS')?'#fef2f2':'#fff'}"><b>${e.phoneId}</b> ${e.shop}<br><span style="color:#666">${e.lat?.toFixed(5)||'no gps'}</span><br><span style="color:#2563eb;font-size:10px">▶ TRACE LIVE</span></div>`).join('')||'No clients - open /clients on another phone';
  list.forEach(e=>{if(e.lat&&e.lng){ if(!markers[e.phoneId]) markers[e.phoneId]=L.marker([e.lat,e.lng]).addTo(map).bindPopup(e.phoneId+'<br>'+e.shop); else markers[e.phoneId].setLatLng([e.lat,e.lng]); }});
 });
}
function traceClient(id){ fetch('/api/tracking/'+id).then(r=>r.json()).then(t=>{ if(poly) map.removeLayer(poly); if(t.length){ let pts=t.map(p=>[p.lat,p.lng]).filter(p=>p[0]); poly=L.polyline(pts,{color:'#2563eb',weight:4}).addTo(map); map.fitBounds(poly.getBounds()); document.getElementById('mapTitle').innerText='Tracing Client: '+id; document.getElementById('trailBox').innerHTML=t.slice(-8).reverse().map(e=>`<div>${e.time?.slice(11,19)} ${e.type}</div>`).join(''); } }); }
setInterval(loadSOS,4000); loadSOS();
</script>
</body></html>
