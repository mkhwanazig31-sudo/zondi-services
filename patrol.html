<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui;background:#fff}#map{height:60vh;width:100%}</style>
</head><body>
<div id="map"></div>
<div id="list" style="padding:12px"></div>
<script>
let map=L.map('map').setView([-25.6,27.98],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
async function load(){let r=await fetch('/api/sos-feed');let d=await r.json();
 document.getElementById('list').innerHTML=d.map(x=>`<div>${x.name} - ${x.lat},${x.lng} - ${x.sos?'🚨SOS':''} ${x.time}</div>`).join('')||'No clients yet';
 d.forEach(x=>{if(x.lat) L.marker([x.lat,x.lng]).addTo(map).bindPopup(x.name)});
}
load(); setInterval(load,5000);
</script></body></html>
