<!DOCTYPE html><html><head><title>Patrollers OS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;overflow:hidden}
.nav{height:52px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:#fff;position:fixed;top:0;left:0;right:0;z-index:1000}
#map{position:fixed;top:52px;left:0;right:0;bottom:180px;z-index:1;background:#ddd}
.topbar{position:fixed;top:60px;left:10px;right:10px;z-index:900;display:flex;gap:6px;overflow-x:auto}
.topbar select,.topbar button{padding:8px 12px;border-radius:12px;border:0;background:#fff;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.os-dock{position:fixed;bottom:0;left:0;right:0;z-index:950;background:#fff;border-radius:28px 28px 0 0;padding:12px 12px 18px;box-shadow:0 -10px 30px rgba(0,0,0,.3);max-height:60vh;overflow-y:auto}
.grid-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.app{text-align:center;cursor:pointer;padding:6px;border-radius:16px}.app:active{transform:scale(.92);background:#f1f5f9}
.app .ico{width:56px;height:56px;margin:0 auto;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);position:relative}
.app span{font-size:10px;font-weight:700;display:block;margin-top:6px;color:#1e293b}
.window{position:fixed;bottom:200px;left:10px;right:10px;z-index:940;background:#fff;border-radius:20px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:45vh;overflow-y:auto;display:none}.window.open{display:block}
.blue-dot{width:16px;height:16px;background:#4285f4;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(66,133,244,.25)}
</style></head><body>
<script>let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null'); if(!auth) location.href='/login'</script>
<div class="nav"><div><b>🛡️ PATROLLERS OS</b><br><span id="gEmail" style="font-size:10px;color:#94a3b8"></span></div><div><span style="font-size:10px;background:#16a34a;padding:5px 10px;border-radius:12px;color:#fff">● LIVE</span> <button onclick="localStorage.clear();location.href='/login'" style="padding:6px 12px;border-radius:20px;border:0;background:#fff;font-size:11px">Logout</button></div></div>
<div class="topbar"><select id="layerSelect"><option value="satellite">🛰️ Satellite</option><option value="street">Street</option></select><button onclick="map.setZoom(19)">19</button><button onclick="map.setZoom(20)" style="background:#111;color:#fff">20 Roof</button><button onclick="map.setZoom(21)">21 SUPER</button><button onclick="openGoogle()">📤 Google</button></div>
<div id="map"></div>

<div id="winClients" class="window"><div style="display:flex;justify-content:space-between"><b>📍 Client Pins</b><button onclick="closeWins()" style="border:0;background:#f1f5f9;padding:6px 12px;border-radius:10px">✕</button></div><div id="clientList" style="margin-top:10px"></div><div id="trailBox" style="margin-top:10px;font-size:11px;background:#f8fafc;padding:8px;border-radius:8px">Tap pin → blue dot + trail</div></div>
<div id="winSOS" class="window"><div style="display:flex;justify-content:space-between"><b>🚨 SOS Feed</b><button onclick="closeWins()" style="border:0;background:#f1f5f9;padding:6px 12px;border-radius:10px">✕</button></div><div id="sosFeed" style="margin-top:10px"></div></div>

<div class="os-dock"><div style="width:36px;height:4px;background:#cbd5e1;border-radius:10px;margin:0 auto 10px"></div><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b style="font-size:13px">Zondi OS - All Apps are Folders</b><span id="cCount" style="font-size:11px;color:#64748b">0 clients</span></div>
<div class="grid-apps">
<div class="app" onclick="openWin('clients')"><div class="ico" style="background:#dcfce7">📍</div><span>Client Pins</span></div>
<div class="app" onclick="if(activeId) flyToClient(activeId)"><div class="ico" style="background:#dbeafe">🔵</div><span>Blue Trail</span></div>
<div class="app" onclick="openWin('sos')"><div class="ico" style="background:#fee2e2">🚨</div><span>SOS Feed</span></div>
<div class="app" onclick="toggleLayer()"><div class="ico" style="background:#fef3c7">🛰️</div><span>Satellite</span></div>
<div class="app" onclick="openGoogle()"><div class="ico" style="background:#ffedd5">📤</div><span>Google Maps</span></div>
<div class="app" onclick="loadAll()"><div class="ico" style="background:#f1f5f9">🔄</div><span>Refresh</span></div>
<div class="app" onclick="map.setView([-25.60215,27.9799],16)"><div class="ico" style="background:#111;color:#fff">🏠</div><span>Home Base</span></div>
<div class="app" onclick="alert('Radio PTT coming soon - will use WebRTC')"><div class="ico" style="background:#ccfbf1">📻</div><span>Radio PTT</span></div>
<div class="app" onclick="alert('Scanner coming soon')"><div class="ico" style="background:#e0e7ff">📡</div><span>Scanner</span></div>
<div class="app" style="border:1px dashed #cbd5e1"><div class="ico">➕</div><span>Add App</span></div>
</div></div>

<script>
document.getElementById('gEmail').innerText=auth.email;
let map = L.map('map',{zoomControl:false,maxZoom:22}).setView([-25.60215,27.9799],18);
let sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19}).addTo(map);
let street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
let cur=sat;
function toggleLayer(){map.removeLayer(cur); cur=cur==sat?street.addTo(map):sat.addTo(map); document.getElementById('layerSelect').value=cur==sat?'satellite':'street';}
document.getElementById('layerSelect').onchange=e=>{map.removeLayer(cur); cur=e.target.value=='satellite'?sat.addTo(map):street.addTo(map);};
let markers={}, poly=null, blueDotMarker=null, accCircle=null, activeId=null, lastLat=-25.60215, lastLng=27.9799;

function pinIcon(addr){return L.divIcon({html:`<div style="transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center"><div style="background:#111;color:#fff;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35)">${addr.slice(0,22)}</div><div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #111;margin-top:-1px"></div><div style="font-size:36px;line-height:1;margin-top:2px">📍</div></div>`,className:'',iconSize:[0,0]})}
function blueDotIcon(){return L.divIcon({html:`<div style="position:relative;width:20px;height:20px"><div style="position:absolute;top:50%;left:50%;width:44px;height:44px;background:rgba(66,133,244,.22);border-radius:50%;transform:translate(-50%,-50%)"></div><div class="blue-dot" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>`,className:'',iconSize:[20,20]})}
function openWin(n){closeWins(); document.getElementById('win'+n.charAt(0).toUpperCase()+n.slice(1)).classList.add('open');}
function closeWins(){document.querySelectorAll('.window').forEach(w=>w.classList.remove('open'))}
function openGoogle(){window.open(`https://www.google.com/maps?q=${lastLat},${lastLng}`,'_blank')}
function loadAll(){fetch('/api/sos-feed').then(r=>r.json()).then(list=>{let uniq={}; list.forEach(e=>{if(e.phoneId) uniq[e.phoneId]=e}); document.getElementById('cCount').innerText=Object.keys(uniq).length+' clients'; let html=Object.values(uniq).map(e=>{let name=e.name||'Client'; let addr=e.address||''; let isSOS=e.type&&e.type.includes('SOS'); return `<div onclick="flyToClient('${e.phoneId}')" style="padding:10px;border:1px solid ${isSOS?'#fca5a5':'#e5e7eb'};border-radius:12px;margin-bottom:6px;background:${isSOS?'#fef2f2':'#fff'}"><b>📍 ${name} - ${addr}</b><br><span style="font-size:10px;color:#666">${e.phoneId}</span></div>`}).join(''); document.getElementById('clientList').innerHTML=html||'No clients - open /clients on client phone'; Object.values(uniq).forEach(e=>{if(e.lat&&e.lng){let label=`${e.name||''} - ${e.address||''}`.slice(0,22); if(!markers[e.phoneId]){markers[e.phoneId]=L.marker([e.lat,e.lng],{icon:pinIcon(label)}).addTo(map); markers[e.phoneId].on('click',()=>flyToClient(e.phoneId));} else markers[e.phoneId].setLatLng([e.lat,e.lng]);}}); document.getElementById('sosFeed').innerHTML=list.slice(-15).reverse().map(e=>`<div onclick="flyToClient('${e.phoneId}')" style="padding:6px;border-bottom:1px solid #eee"><b style="color:#e11d48">${e.type}</b> ${e.address||''}<br><span style="font-size:10px;color:#666">${e.time?.slice(11,19)}</span></div>`).join('')||'No SOS';});}
function flyToClient(id){activeId=id; fetch('/api/tracking/'+id).then(r=>r.json()).then(t=>{t=t.filter(p=>p.lat&&p.lng); if(poly) map.removeLayer(poly); if(blueDotMarker) map.removeLayer(blueDotMarker); if(accCircle) map.removeLayer(accCircle); if(t.length){let last=t[t.length-1]; lastLat=last.lat; lastLng=last.lng; map.flyTo([last.lat,last.lng],20,{duration:1}); let pts=t.slice(-20).map(p=>[p.lat,p.lng]); poly=L.polyline(pts,{color:'#2563eb',weight:5}).addTo(map); accCircle=L.circle([last.lat,last.lng],{radius:20,color:'#4285f4',fillOpacity:.15}).addTo(map); blueDotMarker=L.marker([last.lat,last.lng],{icon:blueDotIcon()}).addTo(map); document.getElementById('trailBox').innerHTML=`<b>📍 ${last.address||''}</b><br>● ${last.lat.toFixed(5)},${last.lng.toFixed(5)}<br><a href="https://www.google.com/maps?q=${last.lat},${last.lng}" target="_blank" style="color:#2563eb">Open Google Maps</a>`; openWin('clients');}});}
function sendPing(){navigator.geolocation.getCurrentPosition(p=>{fetch('/api/patroller-ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:auth.email,name:auth.email,lat:p.coords.latitude,lng:p.coords.longitude})})})}
setInterval(sendPing,8000); sendPing();
// FIX WHITE MAP
setTimeout(()=>{map.invalidateSize(); map.setView([-25.60215,27.9799],18);},800);
setInterval(loadAll,4000); loadAll();
</script>
</body></html>
