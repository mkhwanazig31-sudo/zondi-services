<!DOCTYPE html><html><head><title>Patrollers Portal</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui;background:#f8fafc}.nav{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:#fff;position:sticky;top:0;z-index:20}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px}#map{height:68vh;border-radius:12px;min-height:400px}.grid{display:grid;grid-template-columns:1fr 360px;gap:8px;padding:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}#map{height:50vh}}.pin-btn{padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;text-align:left}.pin-btn:hover{border-color:#2563eb}.pin-btn.active{border:2px solid #111;background:#f8fafc}
.blue-dot{width:16px;height:16px;background:#4285f4;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(66,133,244,.25)}
</style></head><body>
<script>let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null'); if(!auth){location.href='/login'} if(auth.role!=='patroller'){location.href='/clients'}</script>
<div class="nav"><div><b>🛡️ PATROLLERS PORTAL</b><br><span style="font-size:10px;color:#94a3b8" id="guardEmail"></span></div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:10px;background:#16a34a;padding:4px 10px;border-radius:12px">● TRACE CLIENTS LIVE</span><button onclick="localStorage.removeItem('zondi_auth');location.href='/login'" style="font-size:11px;padding:6px 12px;border-radius:20px;border:0;background:#fff;color:#111">Logout</button></div></div>
<div class="grid">
<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px"><b id="mapTitle" style="font-size:13px">Tap 📍 pin to fly - Google style</b><div style="display:flex;gap:4px"><select id="layerSelect" style="padding:6px 10px;border-radius:8px;font-size:12px;border:1px solid #ddd"><option value="satellite">Satellite - see houses</option><option value="street">Street</option></select><button onclick="map.setZoom(19)" style="padding:6px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:10px">19</button><button onclick="map.setZoom(20)" style="padding:6px 8px;border-radius:6px;border:0;background:#111;color:#fff;font-size:10px">20 Roof</button><button onclick="map.setZoom(21)" style="padding:6px 8px;border-radius:6px;border:1px solid #2563eb;background:#ede9fe;font-size:10px">21 SUPER</button></div></div><div id="map"></div></div>
<div style="display:flex;flex-direction:column;gap:8px">
<div class="card"><h4 style="margin:0;font-size:13px">📍 All Clients Pins - Tap to Track</h4><div style="font-size:10px;color:#888;margin:4px 0">Google pin - stays upright when you drag</div><div id="clientList" style="max-height:420px;overflow-y:auto"></div><div id="trailBox" style="margin-top:8px;font-size:11px;background:#f8fafc;padding:8px;border-radius:8px">Select pin → blue dot + trail</div></div>
<div class="card"><h4 style="margin:0;font-size:13px">🚨 Live SOS</h4><div id="sosFeed" style="font-size:12px;max-height:200px;overflow-y:auto;margin-top:6px"></div></div>
</div>
</div>
<script>
document.getElementById('guardEmail').innerText = auth.email+' • PATROLLER';
let map = L.map('map',{maxZoom:22}).setView([-25.60215,27.9799],16);
let street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19}).addTo(map);
let cur=sat;
document.getElementById('layerSelect').onchange=e=>{map.removeLayer(cur); cur=e.target.value=='satellite'?sat.addTo(map):street.addTo(map);};
let markers={}; let poly=null; let blueDotMarker=null; let accCircle=null; let activeId=null;

// FIX 2 & 4 - GOOGLE PIN - NO BLACK DOT - BOTTOM ANCHORED LIKE GOOGLE MAPS
function pinIcon(addr){ 
  return L.divIcon({
    html:`<div style="transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center">
      <div style="background:#111;color:#fff;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35)">${addr.slice(0,22)}</div>
      <div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #111;margin-top:-1px"></div>
      <div style="font-size:36px;line-height:1;margin-top:2px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))">📍</div>
    </div>`,
    className:'', iconSize:[0,0], iconAnchor:[0,0]
  });
}

function blueDotIcon(){
  return L.divIcon({
    html:`<div style="position:relative;width:20px;height:20px"><div style="position:absolute;top:50%;left:50%;width:44px;height:44px;background:rgba(66,133,244,.22);border-radius:50%;transform:translate(-50%,-50%)"></div><div class="blue-dot" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div></div>`,
    className:'', iconSize:[20,20], iconAnchor:[10,10]
  });
}

function loadAll(){
 fetch('/api/sos-feed').then(r=>r.json()).then(list=>{
  let uniq={}; list.forEach(e=>{if(e.phoneId) uniq[e.phoneId]=e});
  document.getElementById('clientList').innerHTML = Object.values(uniq).map(e=>{
    let name=e.name||e.shop||'Client'; let addr=e.address||'No address'; let isSOS=e.type&&e.type.includes('SOS');
    return `<div class="pin-btn ${activeId==e.phoneId?'active':''}" onclick="flyToClient('${e.phoneId}')" style="${isSOS?'background:#fef2f2;border-color:#fca5a5':''}"><div style="font-weight:800">📍 ${name} - ${addr}</div><div style="font-size:11px;color:#666">${e.phoneId}</div><div style="font-size:10px;color:${isSOS?'#e11d48':'#2563eb'}">${isSOS?'🚨 SOS':'▶ TAP TO TRACK'}</div></div>`;
  }).join('') || '<div style="font-size:12px;color:#888">No clients - open /clients on client phone</div>';
  Object.values(uniq).forEach(e=>{
    if(e.lat&&e.lng){
      let label = `${e.name||''} - ${e.address||''}`.slice(0,30);
      if(!markers[e.phoneId]){
        markers[e.phoneId]=L.marker([e.lat,e.lng],{icon: pinIcon(label)}).addTo(map);
        markers[e.phoneId].on('click',()=>flyToClient(e.phoneId));
      } else { markers[e.phoneId].setLatLng([e.lat,e.lng]); }
    }
  });
  document.getElementById('sosFeed').innerHTML = list.slice(-15).reverse().map(e=>`<div onclick="flyToClient('${e.phoneId}')" style="padding:6px;border-bottom:1px solid #eee;cursor:pointer"><b style="color:#e11d48">${e.type}</b> 📍${e.address||''}<br><span style="font-size:10px;color:#666">${e.time?.slice(11,19)}</span></div>`).join('')||'No SOS';
 });
}

// FIX 5 - SMOOTH BLUE TRAIL + BLUE DOT LIKE GOOGLE
function flyToClient(id){
 activeId=id;
 fetch('/api/tracking/'+id).then(r=>r.json()).then(t=>{
  t=t.filter(p=>p.lat&&p.lng&&Math.abs(p.lat)>1); // remove 0,0 jitter
  if(poly){map.removeLayer(poly);} if(blueDotMarker){map.removeLayer(blueDotMarker);} if(accCircle){map.removeLayer(accCircle);}
  if(t.length){
    let last = t[t.length-1];
    map.flyTo([last.lat,last.lng],20,{duration:1.2});
    // FIX 5 - only last 20 points, smooth line, no scribble
    let pts=t.slice(-20).map(p=>[p.lat,p.lng]);
    poly=L.polyline(pts,{color:'#2563eb',weight:5,lineCap:'round',lineJoin:'round'}).addTo(map);
    // Google blue dot + accuracy circle
    accCircle=L.circle([last.lat,last.lng],{radius:20,color:'#4285f4',fillColor:'#4285f4',fillOpacity:0.15,weight:1}).addTo(map);
    blueDotMarker=L.marker([last.lat,last.lng],{icon:blueDotIcon(),zIndexOffset:1000}).addTo(map);
    document.getElementById('mapTitle').innerText=`Tracing 📍 ${last.address||id} - Blue dot = live`;
    document.getElementById('trailBox').innerHTML = `<b>📍 ${last.address||''}</b><br><span style="color:#4285f4">● Live</span> ${last.lat.toFixed(5)}, ${last.lng.toFixed(5)}<br><a href="https://www.google.com/maps?q=${last.lat},${last.lng}" target="_blank" style="color:#2563eb;font-weight:700">Open in Google Maps - like 8643 Motsatsi Rd</a>`;
  }
  loadAll();
 });
}
setInterval(loadAll,4000); loadAll();
</script>
</body></html>
