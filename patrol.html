<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrol - Zondi</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin-top:12px}.btn{padding:10px 14px;border-radius:999px;border:none;font-weight:700;cursor:pointer}.gold{background:#f5c518;color:#000}.green{background:#22c55e;color:#000}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}</style></head>
<body><div style="display:flex;justify-content:space-between"><b>🚓 PATROL PORTAL</b><button onclick="localStorage.clear();location.href='/login'" style="background:#111;border:1px solid #333;color:#fff;border-radius:999px;padding:8px 12px">Sign out</button></div>
<div class="card"><div style="font-size:10px"><span class="dot"></span> ON DUTY</div><b>Live Clients</b><div id="clients" style="margin-top:8px;color:#888;font-size:12px">Waiting for live locations...</div><button class="btn gold" style="width:100%;margin-top:10px" onclick="loadLive()">Refresh Live</button></div>
<div class="card"><b>Recent SOS</b><div id="sos" style="font-size:12px;color:#aaa;margin-top:6px">No SOS yet</div></div>
<div class="card"><b>Radio PTT</b><div style="font-size:11px;color:#666">Hold to talk to other patrollers</div><button class="btn green" style="width:100%;margin-top:10px" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎙️ HOLD TO TALK</button><div id="radioLog" style="font-size:11px;margin-top:8px"></div></div>
<script>
const token=localStorage.getItem('zondi_token'); if(!token) location.href='/login';
async function loadLive(){
 const r=await fetch('/api/location/live',{headers:{'Authorization':'Bearer '+token}}); const j=await r.json();
 if(!j.ok){ document.getElementById('clients').innerText=j.error; return; }
 if(!j.locations.length){ document.getElementById('clients').innerText='No clients sharing right now'; return; }
 document.getElementById('clients').innerHTML=j.locations.map(c=>`<div style="border-bottom:1px solid #222;padding:6px 0">${c.name||c.email} - ${c.lat?.toFixed(4)},${c.lng?.toFixed(4)} <a href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank" style="color:#f5c518">Map</a></div>`).join('');
}
async function loadSOS(){
 const r=await fetch('/api/sos-feed',{headers:{'Authorization':'Bearer '+token}}); const j=await r.json();
 if(Array.isArray(j) && j.length) document.getElementById('sos').innerHTML=j.slice(-5).reverse().map(s=>`<div>${s.name} - ${new Date(s.time).toLocaleTimeString()} <a href="https://maps.google.com/?q=${s.lat},${s.lng}" target="_blank" style="color:#ef4444">SOS MAP</a></div>`).join('');
}
setInterval(()=>{loadLive();loadSOS();},5000); loadLive(); loadSOS();
let mediaRecorder, chunks=[];
async function startRec(){
 const stream=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(stream); chunks=[];
 mediaRecorder.ondataavailable=e=>chunks.push(e.data);
 mediaRecorder.onstop=async ()=>{
  const blob=new Blob(chunks,{type:'audio/webm'}); const fd=new FormData(); fd.append('audio',blob,'radio.webm');
  const r=await fetch('/api/radio/push',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd}); const j=await r.json();
  document.getElementById('radioLog').innerHTML+=`<div>Sent: ${new Date().toLocaleTimeString()}</div>`;
 };
 mediaRecorder.start();
}
function stopRec(){ if(mediaRecorder) mediaRecorder.stop(); }
</script></body></html>
