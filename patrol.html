<!DOCTYPE html><html><head><title>Patrollers Portal - HD + WhatsApp</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui;background:#f8fafc}.nav{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:#fff;position:sticky;top:0;z-index:20}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px}#map{height:68vh;border-radius:12px;min-height:420px}.grid{display:grid;grid-template-columns:1fr 360px;gap:8px;padding:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}#map{height:50vh}}.pin-btn{padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;text-align:left}.pin-btn.active{border:2px solid #111}.wa-btn{background:#25D366;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px;width:100%;margin-top:6px}</style></head><body>
<script>let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null'); if(!auth) location.href='/login';</script>
<div class="nav"><div><b>🛡️ PATROLLERS HD</b><br><span style="font-size:10px;color:#94a3b8" id="guardEmail"></span></div><div style="display:flex;gap:8px"><span style="font-size:10px;background:#25D366;padding:4px 10px;border-radius:12px">● WHATSAPP SHARE LIVE</span><button onclick="localStorage.removeItem('zondi_auth');location.href='/login'" style="font-size:11px;padding:6px 12px;border-radius:20px;border:0;background:#fff">Logout</button></div></div>

<div class="grid"><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px"><b id="mapTitle" style="font-size:13px">Tap 📍 pin - WhatsApp share</b><div style="display:flex;gap:4px"><select id="layerSelect" style="padding:6px;border-radius:8px;font-size:11px"><option value="google">Google HD</option><option value="esri">Esri</option><option value="street">Street</option></select><button onclick="map.setZoom(20)" style="padding:6px 8px;border-radius:6px;background:#111;color:#fff;font-size:10px">20 Roof</button><button onclick="map.setZoom(21)" style="padding:6px 8px;border-radius:6px;background:#2563eb;color:#fff;font-size:10px">21 HD</button></div></div><div id="map"></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div class="card"><h4 style="margin:0;font-size:13px">📍 All Client Pins - Tap + WhatsApp</h4><div id="clientList" style="max-height:420px;overflow-y:auto"></div><div id="trailBox" style="margin-top:8px;font-size:11px;background:#f8fafc;padding:10px;border-radius:10px">Select pin</div></div><div class="card"><h4 style="margin:0;font-size:13px">🚨 Live SOS</h4><div id="sosFeed" style="font-size:12px;max-height:180px;overflow-y:auto"></div></div></div></div>

<script>
document.getElementById('guardEmail').innerText=auth.email;
let map = L.map('map',{maxZoom:22}).setView([-25.585,28.03],16);
let google = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:22,maxNativeZoom:20,attribution:'Google'}).addTo(map);
let esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19});
let street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
let cur=google;
document.getElementById('layerSelect').onchange=e=>{map.removeLayer(cur); cur=e.target.value=='google'?google.addTo(map):e.target.value=='esri'?esri.addTo(map):street.addTo(map);};

let markers={}, poly=null, activeId=null;
function pinIcon(txt){return L.divIcon({html:`<div style="background:#111;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)">📍 ${txt.slice(0,24)}</div>`,className:'',iconAnchor:[20,20]})}

function shareWA(lat,lng,addr,name){
  let gmaps = `https://www.google.com/maps?q=${lat},${lng}`;
  let msg = `🚨 ZONDI PATROL - CLIENT LOCATION\n📍 ${name} - ${addr}\n🗺️ ${gmaps}\n⏰ ${new Date().toLocaleString()}\nPatroller: ${auth.email}`;
  let url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

function loadAll(){
 fetch('/api/sos-feed').then(r=>r.json()).then(list=>{fetch('/api/users').then(r=>r.json()).then(users=>{
  let uniq={}; list.forEach(e=>{if(e.phoneId) uniq[e.phoneId]=e});
  Object.values(uniq).forEach(u=>{let f=users.find(x=>x.email==u.email); if(f){u.address=f.address||u.address; u.shopName=f.shop||u.shop; u.clientName=f.name||u.clientName;}});
  document.getElementById('clientList').innerHTML=Object.values(uniq).map(e=>{
   let name=e.clientName||e.name||'Client'; let addr=e.address||'No address';
   return `<div class="pin-btn ${activeId==e.phoneId?'active':''}" onclick="flyToClient('${e.phoneId}')">
   <div style="font-weight:800">📍 ${name} - ${addr}</div><div style="font-size:11px;color:#666">${e.shopName||e.shop||''} • ${e.phoneId}</div>
   <button class="wa-btn" onclick="event.stopPropagation(); shareWA(${e.lat},${e.lng},'${(addr).replace(/'/g,"")}', '${(name).replace(/'/g,"")}')">📲 Share to WhatsApp Group</button></div>`;
  }).join('')||'No clients';
  Object.values(uniq).forEach(e=>{if(e.lat&&e.lng){let label=`${e.clientName||''} - ${e.address||''}`; if(!markers[e.phoneId]){markers[e.phoneId]=L.marker([e.lat,e.lng],{icon:pinIcon(label)}).addTo(map); markers[e.phoneId].on('click',()=>flyToClient(e.phoneId)); markers[e.phoneId].bindPopup(`<b>📍 ${e.clientName||''}</b><br>${e.address||''}<br><button onclick="shareWA(${e.lat},${e.lng},'${(e.address||'').replace(/'/g,"")}','${(e.clientName||'').replace(/'/g,"")}')" style="margin-top:6px;background:#25D366;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:700;width:100%">📲 WhatsApp Share</button>`);} else markers[e.phoneId].setLatLng([e.lat,e.lng]);}});
  document.getElementById('sosFeed').innerHTML=list.slice(-15).reverse().map(e=>`<div onclick="flyToClient('${e.phoneId}')" style="padding:6px;border-bottom:1px solid #eee;cursor:pointer"><b>${e.type}</b> 📍${e.address||''}<br><span style="font-size:10px">${e.time?.slice(11,19)}</span></div>`).join('');
 });});
}

function flyToClient(id){
 activeId=id;
 fetch('/api/tracking/'+id).then(r=>r.json()).then(t=>{
  if(poly) map.removeLayer(poly);
  if(t.length){
   let last=t[t.length-1];
   map.flyTo([last.lat,last.lng],20,{duration:1});
   let pts=t.map(p=>[p.lat,p.lng]).filter(p=>p[0]);
   poly=L.polyline(pts,{color:'#2563eb',weight:5}).addTo(map);
   document.getElementById('mapTitle').innerText=`Tracing 📍 ${last.address||id}`;
   document.getElementById('trailBox').innerHTML=`
   <b>📍 ${last.clientName||''} - ${last.address||''}</b><br>
   <div style="margin:6px 0;display:flex;gap:6px;flex-wrap:wrap">
   <a href="https://www.google.com/maps?q=${last.lat},${last.lng}" target="_blank" style="padding:8px 12px;background:#fff;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#111;font-weight:700;font-size:12px">🗺️ Open Google Maps HD</a>
   <button onclick="shareWA(${last.lat},${last.lng},'${(last.address||'').replace(/'/g,"")}','${(last.clientName||'').replace(/'/g,"")}')" style="padding:8px 12px;background:#25D366;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:12px">📲 Share to WhatsApp</button>
   </div>
   <div style="font-size:11px;color:#666">${last.lat.toFixed(5)}, ${last.lng.toFixed(5)} • ${last.shopName||''}</div>
   <div style="margin-top:6px">${t.slice(-6).reverse().map(e=>`<div>${e.time?.slice(11,19)} ${e.lat.toFixed(5)}</div>`).join('')}</div>`;
  }
  loadAll();
 });
}

setInterval(loadAll,4000); loadAll();
</script>
</body></html>
