<!DOCTYPE html><html><head><title>Patrol OS LIVE</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;min-height:100vh}
.phone{max-width:420px;margin:0 auto;min-height:100vh;background:#38bdf8;position:relative;display:flex;flex-direction:column}
.nav{padding:10px 14px;background:rgba(0,0,0,.2);color:#fff;display:flex;justify-content:space-between;align-items:center}
.grid{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.app{text-align:center;cursor:pointer}
.app .ico{width:64px;height:64px;margin:0 auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.app span{font-size:10px;font-weight:700;color:#fff;display:block;margin-top:5px}
.win{position:absolute;inset:0;z-index:50;background:#fff;display:none;flex-direction:column}
.win.open{display:flex}
.win-h{padding:12px;background:#0f172a;color:#fff;display:flex;justify-content:space-between}
#map{flex:1;min-height:420px}
.live-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1} 50%{opacity:0.3}}
</style></head><body>
<script>
let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null');
if(!auth || auth.role!=='patroller'){ if(!auth) location.href='/login'; }
</script>
<div class="phone">
<div class="nav"><div><b>🛡️ ZONDI PATROL OS</b><br><span style="font-size:10px"><span class="live-dot"></span> LIVE TRACKING • <span id="clientCount">0 clients</span></span></div><button onclick="localStorage.clear();location.href='/login'" style="padding:6px 10px;border-radius:20px;border:0;font-size:11px">Logout</button></div>

<div class="grid">
<div class="app" onclick="openWin('tracker')"><div class="ico">🛰️</div><span>Tracker</span></div>
<div class="app" onclick="openWin('sos')"><div class="ico" style="background:#fee2e2">🚨</div><span>SOS Feed</span></div>
<div class="app" onclick="openWin('clients')"><div class="ico" style="background:#dcfce7">📍</div><span>Client Pins</span></div>
<div class="app" onclick="alert('Radio PTT coming')"><div class="ico" style="background:#e9d5ff">📻</div><span>Radio PTT</span></div>
<div class="app" onclick="openWin('list')"><div class="ico">👥</div><span>Clients List</span></div>
<div class="app" onclick="openWin('settings')"><div class="ico">⚙️</div><span>Settings</span></div>
</div>

<!-- TRACKER APP - MAP INSIDE MENU BOX -->
<div id="win-tracker" class="win"><div class="win-h"><b>🛰️ LIVE Tracker - Clients move auto</b><button onclick="closeWin()" style="border:0;border-radius:8px;padding:6px 10px">✕</button></div><div id="map"></div><div style="padding:8px;background:#f1f5f9;font-size:11px;display:flex;gap:8px"><span style="background:#22c55e;color:#fff;padding:2px 8px;border-radius:10px">🟢 Live</span><span id="lastUpdate">Updating every 3s...</span><button onclick="loadSOS()" style="margin-left:auto;padding:4px 8px;border-radius:8px;border:1px solid #ddd;background:#fff">Refresh</button></div></div>

<div id="win-sos" class="win"><div class="win-h"><b>🚨 SOS Feed Live</b><button onclick="closeWin()" style="border:0;border-radius:8px;padding:6px 10px">✕</button></div><div id="sosList" style="padding:10px;overflow-y:auto;flex:1"></div></div>
<div id="win-clients" class="win"><div class="win-h"><b>📍 Client Pins Live</b><button onclick="closeWin()" style="border:0;border-radius:8px;padding:6px 10px">✕</button></div><div id="pinList" style="padding:10px;overflow-y:auto;flex:1"></div></div>
<div id="win-list" class="win"><div class="win-h"><b>👥 All Clients</b><button onclick="closeWin()" style="border:0;border-radius:8px;padding:6px 10px">✕</button></div><div id="allList" style="padding:10px;overflow-y:auto;flex:1"></div></div>
<div id="win-settings" class="win"><div class="win-h"><b>⚙️ Settings</b><button onclick="closeWin()" style="border:0;border-radius:8px;padding:6px 10px">✕</button></div><div style="padding:16px;font-size:13px" id="setBox"></div></div>
</div>

<script>
let map = L.map('map',{zoomControl:false}).setView([-25.60215,27.9799],14);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:0.4}).addTo(map);

let clientMarkers = {}; // phoneId -> marker
let clientTrails = {}; // phoneId -> polyline
let allClients = {}; // phoneId -> last data

function openWin(n){document.querySelectorAll('.win').forEach(w=>w.classList.remove('open')); document.getElementById('win-'+n).classList.add('open'); setTimeout(()=>map.invalidateSize(),300);}
function closeWin(){document.querySelectorAll('.win').forEach(w=>w.classList.remove('open')); document.getElementById('win-tracker').classList.add('open'); setTimeout(()=>map.invalidateSize(),300);}

// LIVE - NO REFRESH NEEDED - Poll every 3 seconds
async function loadSOS(){
 try{
  let res = await fetch('/api/sos-feed');
  let feed = await res.json();
  if(!feed.length) return;

  // Group by phoneId - last position
  let latest = {};
  feed.forEach(f=>{
    if(f.lat && f.lng) latest[f.phoneId]=f;
  });

  // Update counts
  document.getElementById('clientCount').innerText = Object.keys(latest).length + ' clients live';
  document.getElementById('lastUpdate').innerText = 'Last: '+ new Date().toLocaleTimeString() + ' - auto 3s';

  // For each client, update marker WITHOUT refresh
  Object.values(latest).forEach(c=>{
    allClients[c.phoneId]=c;
    let lat = parseFloat(c.lat), lng=parseFloat(c.lng);
    if(!clientMarkers[c.phoneId]){
      // New client - create marker
      let icon = L.divIcon({html:`<div style="background:#ef4444;color:#fff;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap">📍 ${c.name||c.phoneId.substring(0,6)}</div>`,className:'',iconSize:null});
      clientMarkers[c.phoneId]=L.marker([lat,lng],{icon:icon}).addTo(map);
      clientMarkers[c.phoneId].bindPopup(`<b>${c.name||'Client'}</b><br>${c.address||''}<br><small>${c.phoneId}</small><br><a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">Open in Maps</a>`);
      // Trail
      clientTrails[c.phoneId]=L.polyline([[lat,lng]],{color:'#2563eb',weight:3,opacity:0.7}).addTo(map);
    }else{
      // Existing client - MOVE marker smoothly
      clientMarkers[c.phoneId].setLatLng([lat,lng]);
      // Extend trail
      let trail = clientTrails[c.phoneId].getLatLngs();
      trail.push([lat,lng]);
      if(trail.length>50) trail=trail.slice(-50); // keep last 50 points
      clientTrails[c.phoneId].setLatLngs(trail);
    }
  });

  // Update lists
  document.getElementById('sosList').innerHTML = feed.slice(-30).reverse().map(f=>`<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px"><b>${f.type||'SOS'}</b> - ${f.name||f.phoneId}<br><small>${f.address||''} • ${new Date(f.time).toLocaleTimeString()}</small></div>`).join('');
  document.getElementById('pinList').innerHTML = Object.values(latest).map(c=>`<div style="padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;font-size:12px"><b>📍 ${c.name||c.phoneId}</b><br>${c.address||''}<br><small>Lat:${c.lat} Lng:${c.lng}</small><br><button onclick="map.setView([${c.lat},${c.lng}],17);closeWin()" style="margin-top:6px;padding:6px 10px;border-radius:8px;border:0;background:#111;color:#fff">📍 Track Live</button></div>`).join('');
  document.getElementById('allList').innerHTML = document.getElementById('pinList').innerHTML;
  document.getElementById('setBox').innerHTML = `Logged in as: <b>${auth.email}</b><br><br>Live tracking: <span style="color:#22c55e">● ON - updates every 3s without refresh</span><br><br>Clients seen: ${Object.keys(latest).length}<br>Markers: ${Object.keys(clientMarkers).length}`;
 }catch(e){console.log(e)}
}

// Patroller also pings his own location
async function pingPatroller(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    fetch('/api/patroller-ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:auth.email,name:localStorage.getItem('zondi_shopname')||auth.email,lat:p.coords.latitude,lng:p.coords.longitude})});
  });
 }
}

// Start live loops
loadSOS();
setInterval(loadSOS, 3000); // <-- THIS IS THE MAGIC - updates every 3s, no refresh needed
setInterval(pingPatroller, 10000);
setTimeout(()=>map.invalidateSize(),500);
</script>
</body></html>
