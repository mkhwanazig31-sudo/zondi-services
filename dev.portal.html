<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:20px}form{background:#1e293b;padding:20px;border-radius:12px;max-width:400px}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:0;background:#0f172a;color:#fff}button{padding:10px 16px;border-radius:8px;border:0;background:#22c55e;font-weight:bold}.card{background:#1e293b;padding:12px;border-radius:10px;margin:8px 0}</style></head><body><h2>Dev Portal</h2><form id="devLogin"><input id="dp" type="password" placeholder="Dev Password"><button>Login Dev</button></form><div id="panel" style="display:none"><button id="load">Load Pending</button><div id="list"></div></div><p id="msg"></p>
<script>
let t=localStorage.getItem('zondi_token');devLogin.onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/api/dev-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:dp.value})});let j=await r.json();if(!j.ok){msg.textContent=j.error;return;}localStorage.setItem('zondi_token',j.token);t=j.token;panel.style.display='block';devLogin.style.display='none';};
load.onclick=async()=>{let r=await fetch('/api/admin/pending',{headers:{Authorization:'Bearer '+t}});let j=await r.json();list.innerHTML=j.pending.map(p=>`<div class=card>${p.email} - ${p.name} <button onclick="act('${p.email}','approve')">Approve</button> <button onclick="act('${p.email}','reject')">Reject</button></div>`).join('')||'No pending';};
async function act(email,action){let r=await fetch('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({email,action})});load.click();}
</script></body></html>
