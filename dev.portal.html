<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev - Zondi</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin-top:12px}.btn{padding:8px 12px;border-radius:999px;border:none;font-weight:700;cursor:pointer;font-size:12px}.gold{background:#f5c518;color:#000}.green{background:#22c55e;color:#000}.red{background:#7f1d1d;color:#fff}.stat{flex:1;background:#111;border:1px solid #222;border-radius:12px;padding:10px;text-align:center}</style></head>
<body><div style="display:flex;justify-content:space-between"><b>🛠️ Developer Portal</b><button onclick="localStorage.clear();location.href='/login'" style="background:#111;border:1px solid #333;color:#fff;border-radius:999px;padding:6px 12px">Exit</button></div>
<div style="display:flex;gap:8px;margin-top:12px"><div class="stat"><div id="cClients" style="font-size:20px;font-weight:800">0</div><div style="font-size:10px;color:#666">CLIENTS</div></div><div class="stat"><div id="cPat" style="font-size:20px;font-weight:800">0</div><div style="font-size:10px;color:#666">PATROLLERS</div></div><div class="stat"><div id="cPend" style="font-size:20px;font-weight:800">0</div><div style="font-size:10px;color:#666">PENDING</div></div></div>
<div class="card"><b style="font-size:12px">Operations</b><div style="display:flex;gap:6px;margin-top:8px"><button class="btn gold" onclick="loadPending()">Pending Approvals</button><button class="btn" style="background:#222;color:#fff" onclick="loadStats()">Refresh Stats</button></div><div id="ops" style="margin-top:10px;font-size:12px;color:#aaa">Ready</div></div>
<div class="card"><b style="font-size:12px">Patrollers</b><div id="patList" style="font-size:12px;margin-top:8px;color:#888">No patrollers</div></div>
<script>
const token=localStorage.getItem('zondi_token'); if(!token) location.href='/login';
async function loadStats(){ const r=await fetch('/api/dev-stats',{headers:{'Authorization':'Bearer '+token}}); const j=await r.json(); if(j.ok){ document.getElementById('cClients').innerText=j.clients; document.getElementById('cPat').innerText=j.patrollers; document.getElementById('cPend').innerText=j.pending; } }
async function loadPending(){
 const r=await fetch('/api/admin/pending',{headers:{'Authorization':'Bearer '+token}}); const j=await r.json();
 if(!j.pending.length){ document.getElementById('ops').innerText='No pending patrollers'; return; }
 document.getElementById('ops').innerHTML=j.pending.map(p=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:6px 0">${p.email} (${p.status}) <span><button class="btn green" onclick="approve('${p.email}','approve')">Approve</button> <button class="btn red" onclick="approve('${p.email}','reject')">Reject</button></span></div>`).join('');
}
async function approve(email,action){ await fetch('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({email,action})}); loadPending(); loadStats(); }
loadStats();
</script></body></html>
