<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="theme-color" content="#07100b">
  <meta name="color-scheme" content="dark">

  <title>Zondi — Login</title>

  <style>
    :root {
      --bg: #050806;
      --bg-soft: #09110c;
      --card: rgba(13, 20, 15, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);

      --green: #22c55e;
      --green-light: #4ade80;
      --green-dark: #16a34a;

      --text: #f8fafc;
      --muted: #8b949e;
      --muted-2: #667078;

      --danger: #ff6b6b;
      --danger-bg: rgba(127, 29, 29, 0.18);

      --warning: #fbbf24;
      --warning-bg: rgba(120, 53, 15, 0.18);

      --input: rgba(255, 255, 255, 0.045);
      --input-focus: rgba(34, 197, 94, 0.08);

      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(34, 197, 94, 0.14),
          transparent 38%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(22, 163, 74, 0.08),
          transparent 32%
        ),
        var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;
      overflow-x: hidden;
    }

    /* Decorative glow */
    body::before {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      top: -150px;
      right: -100px;
      background: rgba(34, 197, 94, 0.08);
      filter: blur(50px);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      bottom: -150px;
      left: -90px;
      background: rgba(34, 197, 94, 0.05);
      filter: blur(55px);
      pointer-events: none;
    }

    .page {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
    }

    .shell {
      width: 100%;
      padding: 30px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--card-border);
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025),
          rgba(255, 255, 255, 0)
        ),
        var(--card);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    /* Top decorative bar */
    .top-line {
      width: 62px;
      height: 4px;
      margin: 0 auto 28px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--green-dark),
        var(--green-light)
      );
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.35);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-wrap {
      width: 78px;
      height: 78px;
      margin: 0 auto 17px;
      border-radius: 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          rgba(74, 222, 128, 0.24),
          rgba(22, 163, 74, 0.11)
        );

      border: 1px solid rgba(74, 222, 128, 0.18);

      box-shadow:
        0 18px 38px rgba(34, 197, 94, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      background: linear-gradient(
        145deg,
        var(--green-light),
        var(--green-dark)
      );

      box-shadow:
        0 9px 22px rgba(34, 197, 94, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .brand h1 {
      font-size: 27px;
      line-height: 1;
      letter-spacing: 0.12em;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .brand p strong {
      color: #b6f3c9;
      font-weight: 700;
    }

    /* Status messages */
    .status {
      display: none;
      margin-bottom: 15px;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.show {
      display: block;
      animation: slideDown 0.25s ease;
    }

    .status.error {
      color: #ffb4b4;
      background: var(--danger-bg);
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    .status.pending {
      color: #fde68a;
      background: var(--warning-bg);
      border: 1px solid rgba(251, 191, 36, 0.18);
    }

    /* Form */
    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field-label {
      font-size: 12px;
      color: #aab3ba;
      font-weight: 700;
      padding-left: 3px;
    }

    .input-wrap {
      min-height: 55px;
      display: flex;
      align-items: center;

      padding: 0 15px;

      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.075);
      background: var(--input);

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: rgba(34, 197, 94, 0.6);
      background: var(--input-focus);
      box-shadow:
        0 0 0 4px rgba(34, 197, 94, 0.08),
        0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .input-icon {
      width: 20px;
      margin-right: 11px;
      opacity: 0.62;
      font-size: 16px;
      flex-shrink: 0;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;

      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);

      font: inherit;
      font-size: 14px;
      padding: 16px 0;
    }

    .input-wrap input::placeholder {
      color: #59636b;
    }

    .password-toggle {
      border: 0;
      background: transparent;
      color: #7f898f;
      cursor: pointer;
      font-size: 15px;
      padding: 7px;
      border-radius: 9px;
      transition: 0.2s ease;
      flex-shrink: 0;
    }

    .password-toggle:hover {
      color: var(--green-light);
      background: rgba(255, 255, 255, 0.05);
    }

    .login-btn {
      width: 100%;
      min-height: 56px;

      margin-top: 4px;

      border: 0;
      border-radius: var(--radius-md);

      background: linear-gradient(
        135deg,
        var(--green-light),
        var(--green-dark)
      );

      color: #031107;

      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.01em;

      cursor: pointer;

      box-shadow:
        0 14px 30px rgba(34, 197, 94, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow:
        0 18px 34px rgba(34, 197, 94, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .login-btn:active {
      transform: translateY(1px) scale(0.995);
    }

    .login-btn:disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
    }

    .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(3, 17, 7, 0.25);
      border-top-color: #031107;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .login-btn.loading .spinner {
      display: block;
    }

    .login-btn.loading .btn-text {
      opacity: 0.85;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer a {
      color: var(--green-light);
      font-weight: 800;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: #86efac;
    }

    .security-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;

      margin-top: 22px;
      padding-top: 18px;

      border-top: 1px solid rgba(255, 255, 255, 0.055);

      color: #5f696f;
      font-size: 11px;
    }

    .security-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .shell {
        padding: 24px 19px 20px;
        border-radius: 24px;
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
      }

      .brand h1 {
        font-size: 25px;
      }
    }

    @media (min-width: 700px) {
      .shell {
        padding: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="shell" aria-label="Zondi login">

      <div class="top-line"></div>

      <div class="brand">
        <div class="logo-wrap">
          <div class="logo" aria-hidden="true">🛡️</div>
        </div>

        <h1>ZONDI</h1>

        <p>
          Community safety for
          <strong>Ga-Rankuwa</strong>
        </p>
      </div>

      <div id="err" class="status error" role="alert"></div>
      <div id="pending" class="status pending" role="alert"></div>

      <form class="form" id="loginForm">

        <div class="field">
          <label class="field-label" for="email">Email address</label>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">✉</span>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">🔒</span>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              class="password-toggle"
              type="button"
              id="togglePassword"
              aria-label="Show password"
              title="Show password"
            >
              👁
            </button>
          </div>
        </div>

        <button
          class="login-btn"
          id="loginBtn"
          type="submit"
        >
          <span class="btn-content">
            <span class="spinner"></span>
            <span class="btn-text">Sign in <span aria-hidden="true">→</span></span>
          </span>
        </button>

      </form>

      <div class="footer">
        Don't have an account?
        <a href="/register">Create one</a>
      </div>

      <div class="security-note">
        <span class="security-dot"></span>
        Secure Zondi community access
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("err");
    const pendingBox = document.getElementById("pending");

    function hideMessages() {
      errorBox.classList.remove("show");
      pendingBox.classList.remove("show");
      errorBox.textContent = "";
      pendingBox.textContent = "";
    }

    function showError(message) {
      pendingBox.classList.remove("show");
      errorBox.textContent = message || "Something went wrong.";
      errorBox.classList.add("show");
    }

    function showPending(message) {
      errorBox.classList.remove("show");
      pendingBox.textContent =
        message || "Your patroller account is waiting for approval.";
      pendingBox.classList.add("show");
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.classList.toggle("loading", loading);

      if (loading) {
        loginBtn.querySelector(".btn-text").textContent = "Signing in…";
      } else {
        loginBtn.querySelector(".btn-text").innerHTML =
          'Sign in <span aria-hidden="true">→</span>';
      }
    }

    togglePassword.addEventListener("click", () => {
      const visible = passwordInput.type === "text";

      passwordInput.type = visible ? "password" : "text";

      togglePassword.textContent = visible ? "👁" : "🙈";
      togglePassword.setAttribute(
        "aria-label",
        visible ? "Show password" : "Hide password"
      );
      togglePassword.setAttribute(
        "title",
        visible ? "Show password" : "Hide password"
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      hideMessages();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          if (response.status === 403) {
            showPending(
              data.error ||
              `Account ${data.status || "pending"}. Wait for admin approval.`
            );
          } else {
            showError(
              data.error ||
              "Unable to sign in. Please check your details and try again."
            );
          }

          return;
        }

        /*
          Your Flask backend returns the sanitized user object directly:
          {
            id,
            email,
            role,
            name,
            phone,
            status,
            created_at
          }

          Store it so the other frontend pages can identify the
          currently logged-in user.
        */
        localStorage.setItem("zondi_user", JSON.stringify(data));
        localStorage.setItem("zondi_email", data.email || email);

        /*
          Route according to the role already returned by Flask.
        */
        switch (data.role) {
          case "patroller":
            window.location.href = "/patrol";
            break;

          case "admin":
            window.location.href = "/admin";
            break;

          case "client":
          default:
            window.location.href = "/clients";
            break;
        }

      } catch (error) {
        console.error("Login error:", error);

        showError(
          "Unable to connect to Zondi. Please check your connection and try again."
        );
      } finally {
        setLoading(false);
      }
    });

    // Small UX improvement: focus email when page opens.
    window.addEventListener("load", () => {
      emailInput.focus();
    });
  </script>
</body>
</html>
