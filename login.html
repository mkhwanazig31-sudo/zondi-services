<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;font-family:Inter}body{margin:0;background:#FFF8F0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.card{background:white;max-width:380px;width:100%;border-radius:28px;padding:28px;box-shadow:0 10px 40px rgba(255,138,61,.15);border:1px solid #FFE5D0}.role{display:flex;gap:8px;margin-bottom:14px} .role div{flex:1;padding:10px;border-radius:12px;border:1.5px solid #FFE5D0;text-align:center;font-weight:700;cursor:pointer} .role div.active{background:#FF8A3D;color:white} input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #FFE5D0;background:#FFFBF7;margin-bottom:12px} button{width:100%;padding:14px;border-radius:14px;border:0;font-weight:800;background:linear-gradient(135deg,#FF8A3D,#FF5E5E);color:white}</style></head><body><div class="card"><h1>👋 ZONDI</h1><p style="color:#8B7355;font-size:14px">Welcoming • Safe • Connected</p><div class="role"><div id="r-client" class="active" onclick="setRole('client')">Client</div><div id="r-patrol" onclick="setRole('patrol')">Patrol</div></div><input id="email" placeholder="Email/phone"><input id="name" placeholder="Name"><button onclick="login()">Enter App →</button><div style="margin-top:16px;padding:14px;background:#FFF5EE;border-radius:14px;border:1px dashed #FFB067"><b>🔐 Developer</b><input id="devPass" type="password" placeholder="zondi@123" style="margin-top:8px"><button onclick="devLogin()">Unlock Dev Portal</button><div id="devErr" style="color:red;font-size:12px"></div></div></div><script>let role='client';function setRole(r){role=r;document.getElementById('r-client').classList.toggle('active',r=='client');document.getElementById('r-patrol').classList.toggle('active',r=='patrol')}async function login(){const e=document.getElementById('email').value||'client@zondi.com';const n=document.getElementById('name').value;const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,role})});const j=await res.json();localStorage.setItem('zondi_user',JSON.stringify(j.user));localStorage.setItem('zondi_name',n);location.href=role=='client'?'/clients.html':'/patrol.html'}async function devLogin(){const p=document.getElementById('devPass').value;const r=await fetch('/api/dev/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const j=await r.json();if(j.ok)location.href='/developers.html';else document.getElementById('devErr').innerText=j.error}</script></body></html>
