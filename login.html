<!DOCTYPE html><html><head><title>Login</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:90%;max-width:360px;background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e7eb}input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:8px;box-sizing:border-box}button{width:100%;padding:12px;border-radius:10px;border:0;background:#111;color:#fff;margin-top:12px;font-weight:700}</style></head><body><div class="card"><h3>Zondi Login</h3><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="msg" style="font-size:12px;color:#e11d48;margin-top:8px"></div></div><script>function login(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pass').value})}).then(r=>r.json()).then(d=>{if(d.error){document.getElementById('msg').innerText='Wrong email/pass';return;} localStorage.setItem('zondi_auth',JSON.stringify(d)); if(d.role=='patroller') location.href='/patrollers'; else location.href='/clients';}).catch(()=>document.getElementById('msg').innerText='No users yet - go to /clients direct');}</script></body></html>
