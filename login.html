<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Login</title><link rel="stylesheet" href="/assets/zondi-theme.css"></head><body>
<div class="center"><section class="panel auth-card">
<div class="auth-logo"><img src="/assets/zondi-logo.png" alt="Zondi"></div><div class="auth-title">Welcome back</div>
<div class="auth-sub">Secure access to the Zondi response network</div><div id="status" class="status hidden" aria-live="polite"></div>
<form id="login"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" required autocomplete="current-password" placeholder="Your password"><button type="button" class="show-pass" id="show">Show</button></div></div>
<button id="loginBtn" class="btn primary block">Sign in</button></form>
<div class="row-between" style="margin-top:13px"><a class="link mini" href="/forgot-password">Forgot password?</a><a class="link mini" href="/register">Create account</a></div>
<div class="dev-box"><div class="row-between"><div><b style="font-size:12px">Developer access</b><div class="mini">Private administration only</div></div><button class="btn" type="button" id="devToggle">Open</button></div>
<form id="devForm" class="hidden" style="margin-top:12px"><div class="field"><label>Developer password</label><div class="password-wrap"><input id="devPass" type="password" autocomplete="off" placeholder="Enter private developer password"><button type="button" class="show-pass" id="showDev">Show</button></div></div>
<button id="devBtn" class="btn green block">Enter Developer Portal</button></form></div>
<div class="row" style="justify-content:center;margin-top:15px"><a class="mini muted" href="/">← Home</a></div>
<footer class="footer" style="padding-bottom:4px">Designed by <span class="gold">G.V Mkhwanazi™</span></footer>
</section></div>
<script>
const $=id=>document.getElementById(id),statusEl=$('status');
const msg=(t,c='')=>{statusEl.hidden=false;statusEl.className='status '+c;statusEl.textContent=t};
function togglePass(inputId,btnId){const i=$(inputId),b=$(btnId);b.onclick=()=>{const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show'};}
function saveSession(d){
  // FIXED: save everywhere patrol & clients check
  localStorage.setItem('zondi_token', d.token);
  sessionStorage.setItem('zondi_token', d.token);
  sessionStorage.setItem('zondi_user', JSON.stringify(d.user));
  localStorage.setItem('zondi_user', JSON.stringify(d.user));
  document.cookie = `zondi_token=${d.token}; path=/; max-age=604800; SameSite=Lax`;
}
togglePass('password','show');togglePass('devPass','showDev');
$('devToggle').onclick=()=>{$('devForm').classList.toggle('hidden');$('devPass').focus()};
$('login').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginBtn').textContent='Signing in…';try{
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
let d={};try{d=await r.json()}catch{throw Error('Server returned an invalid response.')};if(!r.ok||!d.ok)throw Error(d.error||'Login failed');
saveSession(d);
// FIXED: role-based redirect, not /dashboard
const role = (d.user && d.user.role) ? d.user.role.toLowerCase() : 'client';
if(role === 'dev') location.href='/dev';
else if(role === 'patroller') location.href='/patrol';
else location.href='/clients';
}catch(e){msg(e.message,'err')}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Sign in'}};
$('devForm').onsubmit=async e=>{e.preventDefault();$('devBtn').disabled=true;$('devBtn').textContent='Checking…';try{
const r=await fetch('/api/dev-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('devPass').value})});
let d={};try{d=await r.json()}catch{throw Error('Server returned an invalid response.')};
if(!r.ok||!d.ok){if(r.status===503)throw Error('Developer access is not configured on the server. Set DEV_PORTAL_PASSWORD in Vercel → Environment.');throw Error(d.error||'Developer login failed')}
localStorage.setItem('zondi_dev_token', d.token);
sessionStorage.setItem('zondi_dev_token', d.token);
document.cookie = `zondi_token=${d.token}; path=/; max-age=604800; SameSite=Lax`;
location.href=d.redirect||'/dev';
}catch(e){msg(e.message,'err')}finally{$('devBtn').disabled=false;$('devBtn').textContent='Enter Developer Portal'}};
</script></body></html>
