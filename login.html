<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Login</title>
<link rel="stylesheet" href="/assets/zondi-theme.css">
</head>
<body>
<div class="center">
<div class="panel panel-pad auth-card">
  <b style="font-size:20px">Welcome back</b>
  <div class="mini" style="margin-top:4px">Login to your Zondi space.</div>
  <div id="status" class="status hidden" style="margin-top:12px"></div>
  <div style="margin-top:14px">
    <input id="email" class="input" placeholder="Email" style="width:100%;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
    <input id="password" type="password" class="input" placeholder="Password" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
    <button id="loginBtn" class="btn primary" style="width:100%;margin-top:12px">Login</button>
    <div class="row-between" style="margin-top:10px">
      <a class="mini" href="/forgot-password">Forgot password?</a>
      <a class="mini" href="/register">Create account</a>
    </div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function msg(t,c=''){let s=$('status');s.hidden=false;s.textContent=t;s.className='status '+c}
$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(!email||!password) return msg('Fill email and password','err');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw Error(d.error||'Login failed');
    // DUAL STORAGE FIX - midnight bounce
    localStorage.setItem('zondi_token', d.token);
    sessionStorage.setItem('zondi_token', d.token);
    localStorage.setItem('zondi_user', JSON.stringify(d.user));
    sessionStorage.setItem('zondi_user', JSON.stringify(d.user));
    document.cookie=`zondi_token=${d.token}; path=/; max-age=604800`;
    // ROLE ROUTING
    if(d.user.role==='client') location.href='/clients';
    else if(d.user.role==='patroller') location.href='/patrol';
    else if(d.user.role==='dev') location.href='/dev';
    else location.href='/clients';
  }catch(e){ msg(e.message,'err'); }
}
</script>
</body>
</html>
