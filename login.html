<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding-top:80px}form{background:#1e293b;padding:30px;border-radius:12px;width:320px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0;background:#0f172a;color:#fff}button{width:100%;padding:12px;background:#22c55e;border:0;border-radius:8px;font-weight:bold;margin-top:10px}</style></head><body>
<form id="f"><h2>Login</h2><input id="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><p id="msg"></p><a href="/register" style="color:#94a3b8">Register</a> | <a href="/forgot-password" style="color:#94a3b8">Forgot?</a></form>
<script>
f.onsubmit=async(e)=>{e.preventDefault();msg.textContent='...';let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let j=await r.json();if(!j.ok){msg.textContent=j.error;return;}localStorage.setItem('zondi_token',j.token);localStorage.setItem('zondi_user',JSON.stringify(j.user));if(j.user.role==='dev')location='/dev';else if(j.user.role==='patroller')location='/patrol';else location='/clients';}
</script></body></html>
