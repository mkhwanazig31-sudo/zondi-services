<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>Zondi</title><style>
:root{--bg:#07100b;--card:#0d1710;--card2:#111d14;--border:#233126;--text:#f4faf5;--muted:#91a097;--green:#22c55e;--green2:#4ade80;--red:#ef4444;--amber:#f59e0b;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#12351d,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#07100bf2;border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.brand{font-weight:900;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.04em;margin-top:3px}.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(180deg,#101a12,#0b130d);border:1px solid var(--border);border-radius:18px;padding:15px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.h{font-weight:900;font-size:15px}.sub{color:var(--muted);font-size:11px;line-height:1.5}.btn{border:1px solid var(--border);background:#162219;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:800}.btn.green{background:linear-gradient(135deg,var(--green2),var(--green));color:#03200b;border:0}.btn.red{background:#321316;color:#fecaca;border-color:#5b252a}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;background:#09120c;border:1px solid var(--border);color:var(--text);padding:11px;border-radius:11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#2e8f4d}.status{padding:10px 12px;border-radius:11px;background:#101b13;border:1px solid var(--border);color:#cfe9d5;font-size:11px;margin-bottom:10px}.status.err{color:#fecaca;border-color:#5b252a;background:#241214}.status.warn{color:#fde68a;border-color:#5a4314;background:#211a0a}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#122418;color:#b8edc7;font-size:10px;font-weight:800}.danger{color:#fecaca}.muted{color:var(--muted)}#map{height:520px;border-radius:14px;overflow:hidden;border:1px solid var(--border)}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid var(--border);border-radius:13px;background:#0d1710}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:13px}@media(max-width:800px){.span8,.span6,.span4{grid-column:span 12}#map{height:430px}}
</style></head><body>
<main style="min-height:100vh;display:grid;place-items:center;padding:18px"><section class="card" style="width:min(430px,100%);padding:25px"><div class="brand" style="font-size:25px;text-align:center">🛡️ ZONDI<small>Secure response network</small></div><div style="height:18px"></div><div id="status" class="status" hidden></div><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn green" style="width:100%">Sign in</button></form><div class="row" style="justify-content:center;margin-top:15px"><a href="/register" style="color:#86efac">Create account</a><span class="muted">•</span><button class="btn" id="dev">Developer Login</button></div><form id="devForm" hidden style="margin-top:15px"><div class="field"><label>Developer password</label><input id="devPass" type="password" autocomplete="off"></div><button class="btn green" style="width:100%">Enter Developer Portal</button></form></section></main>
<script>
const $=id=>document.getElementById(id), status=$('status');
function msg(t,type=''){status.hidden=false;status.textContent=t;status.className='status '+type}
function saveSession(d){sessionStorage.setItem('zondi_token',d.token);sessionStorage.setItem('zondi_user',JSON.stringify(d.user))}
function go(u){location.href=u}
$('login').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Login failed');saveSession(d);go(d.user.role==='patroller'?'/patrol':'/clients')}catch(e){msg(e.message,'err')}};
$('dev').onclick=()=>{$('devForm').hidden=!$('devForm').hidden;$('devPass').focus()};
$('devForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/dev-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('devPass').value})});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Developer login failed');sessionStorage.setItem('zondi_dev_token',d.token);go('/dev')}catch(e){msg(e.message,'err')}};
</script></body></html>
