<!DOCTYPE html><html><head><title>Clients Portal</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font-family:system-ui;background:#f8fafc}.app{max-width:420px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}.nav{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}.card{margin:10px 12px;padding:16px;border-radius:20px;background:#fff;border:1px solid #e5e7eb}.safe{text-align:center;background:linear-gradient(#fff,#f0fdf4)}.btn{width:100%;padding:18px;border-radius:999px;border:0;font-weight:900;font-size:18px;background:#111;color:#fff;margin-top:10px}.near{padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.app-icon{text-align:center;padding:10px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb;cursor:pointer}.app-icon.ico{width:44px;height:44px;margin:0 auto 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}.app-icon span{font-size:10px;font-weight:700}</style></head><body>
<script>let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null'); if(!auth) location.href='/login'</script>
<div class="app">
<div class="nav"><div><b style="color:#2563eb">CLIENTS PORTAL</b><br><span id="uEmail" style="font-size:10px;color:#888"></span><br><span id="uPin" style="font-size:11px;font-weight:800"></span></div><button onclick="localStorage.clear();location.href='/login'" style="padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:11px">Logout</button></div>
<div class="card safe"><div style="font-size:38px;font-weight:900;color:#16a34a">92% SAFE</div><div id="locStatus" style="font-size:11px;color:#16a34a;margin-top:6px">⌛ Getting GPS...</div><div style="font-size:10px;color:#666">ID: <span id="myId"></span></div></div>
<div class="card" style="border:2px solid #111;text-align:center"><b>EMERGENCY - SEND LIVE TO PATROL</b><button id="sosBtn" class="btn">HOLD 1.5s FOR HELP</button><div id="addrShow" style="font-size:11px;color:#666;margin-top:8px"></div><div id="sosDone" style="display:none;color:#16a34a;font-size:12px;font-weight:700;margin-top:8px">✅ Live location sent to all patrollers!</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">🛡️ Nearby Patrollers</b><button onclick="loadPatrollers()" style="padding:6px 10px;border-radius:10px;border:0;background:#f1f5f9;font-size:11px">🔄</button></div><div style="font-size:10px;color:#888">Who is close to you - distance live</div><div id="nearList" style="margin-top:10px"><div style="font-size:12px;color:#888">Scanning for patrollers...</div></div></div>
<div class="card"><b style="font-size:12px">📱 Apps - 5 Features</b><div class="grid"><div class="app-icon" onclick="startGPS()"><div class="ico" style="background:#f1f5f9">🔄</div><span>Refresh</span></div><div class="app-icon" onclick="openGoogle()"><div class="ico" style="background:#ffedd5">📤</div><span>Google Maps</span></div><div class="app-icon" onclick="location.href='/'"><div class="ico" style="background:#111;color:#fff">🏠</div><span>Home</span></div></div></div>
</div>
<script>
let myAddr=localStorage.getItem('zondi_address')||'555unit4', myShop=localStorage.getItem('zondi_shopname')||'My Shop';
let myName=(JSON.parse(localStorage.getItem('zondi_auth')).name||'Gontse'), email=JSON.parse(localStorage.getItem('zondi_auth')).email;
document.getElementById('uEmail').innerText=email; document.getElementById('uPin').innerText=`📍 ${myName} - ${myAddr}`; document.getElementById('addrShow').innerText=`📍 ${myAddr} will be sent`;
let phoneId=localStorage.getItem('zondi_id')||'zondi_'+Math.random().toString(36).slice(2,6); localStorage.setItem('zondi_id',phoneId); document.getElementById('myId').innerText=phoneId;
let lastLat=-25.60215, lastLng=27.97990;
function haversine(lat1,lon1,lat2,lon2){let R=6371; let dLat=(lat2-lat1)*Math.PI/180; let dLon=(lon2-lon1)*Math.PI/180; let a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function loadPatrollers(){fetch('/api/patrollers-live').then(r=>r.json()).then(list=>{if(!list.length){document.getElementById('nearList').innerHTML='<div style="font-size:12px;color:#888">No patrollers online - patroller must open Patrol portal to send live</div>';return;} let html=list.map((p,i)=>{let dist=haversine(lastLat,lastLng,p.lat,p.lng); let eta=Math.round(dist*4); let color=dist<1?'#16a34a':dist<3?'#d97706':'#dc2626'; return `<div class="near"><div><b>Patrol ${i+1} • ${p.name||p.email?.split('@')[0]}</b><br><span style="font-size:11px;color:#666">${dist.toFixed(1)} km away</span></div><div style="text-align:right"><div style="font-weight:800;color:${color}">${dist.toFixed(1)}km</div><div style="font-size:10px">${eta} min</div></div></div>`;}).join(''); document.getElementById('nearList').innerHTML=html;});}
function openGoogle(){window.open(`https://www.google.com/maps?q=${lastLat},${lastLng}`,'_blank')}
function showGPS(lat,lng,acc){lastLat=lat;lastLng=lng; document.getElementById('locStatus').innerHTML=`✅ Live ${lat.toFixed(5)},${lng.toFixed(5)} • ${Math.round(acc)}m sent`; fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneId,shop:myShop,address:myAddr,name:myName,lat,lng,type:'CLIENT_PING',email,acc})}); loadPatrollers();}
function startGPS(){navigator.geolocation.getCurrentPosition(p=>{showGPS(p.coords.latitude,p.coords.longitude,p.coords.accuracy); setInterval(()=>navigator.geolocation.getCurrentPosition(pos=>showGPS(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy)),10000);},()=>{}, {enableHighAccuracy:true});}
startGPS(); setInterval(loadPatrollers,5000);
let hold,btn=document.getElementById('sosBtn'); let sendSOS=()=>{navigator.geolocation.getCurrentPosition(p=>{lastLat=p.coords.latitude;lastLng=p.coords.longitude; fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneId,shop:myShop,address:myAddr,name:myName,lat:p.coords.latitude,lng:p.coords.longitude,type:'CLIENT_SOS',email})}).then(()=>{btn.innerText='SOS SENT ✅ LIVE'; btn.style.background='#16a34a'; document.getElementById('sosDone').style.display='block'; setTimeout(()=>{btn.innerText='HOLD 1.5s FOR HELP'; btn.style.background='#111';},4000);})})}; btn.addEventListener('touchstart',()=>{hold=setTimeout(sendSOS,1500)}); btn.addEventListener('touchend',()=>clearTimeout(hold)); btn.addEventListener('mousedown',()=>{hold=setTimeout(sendSOS,1500)}); btn.addEventListener('mouseup',()=>clearTimeout(hold));
</script>
</body></html>
