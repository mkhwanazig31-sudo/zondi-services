<!DOCTYPE html><html><head><title>Client OS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui;background:#0ea5e9;min-height:100vh}.phone{max-width:420px;margin:0 auto;min-height:100vh;background:#0ea5e9;position:relative;display:flex;flex-direction:column}.nav{padding:12px 16px;display:flex;justify-content:space-between;color:#fff;background:rgba(0,0,0,.15)} .grid{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.app{text-align:center} .app .ico{width:64px;height:64px;margin:0 auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)} .app span{font-size:11px;color:#fff;font-weight:700;display:block;margin-top:6px} .app-window{position:absolute;inset:0;z-index:100;background:#fff;display:none;flex-direction:column}.app-window.open{display:flex} .win-header{padding:14px;background:#0f172a;color:#fff;display:flex;justify-content:space-between} #map{flex:1;min-height:300px}</style></head><body>
<script>let auth=JSON.parse(localStorage.getItem('zondi_auth')||'null'); if(!auth) location.href='/login'</script>
<div class="phone">
<div class="nav"><div><b>📱 CLIENT OS</b><br><span id="uEmail" style="font-size:10px"></span></div><button onclick="localStorage.clear();location.href='/login'" style="padding:6px 12px;border-radius:20px;border:0">Logout</button></div>
<div class="grid">
<div class="app" onclick="sendSOS()"><div class="ico" style="background:#ef4444">🚨</div><span>SOS Panic</span></div>
<div class="app" onclick="openApp('patrols')"><div class="ico" style="background:#22c55e">🚓</div><span>Nearby Patrols</span></div>
<div class="app" onclick="openApp('track')"><div class="ico" style="background:#f59e0b">📍</div><span>My Location</span></div>
<div class="app" onclick="openApp('radio')"><div class="ico" style="background:#8b5cf6">📻</div><span>Radio</span></div>
<div class="app" onclick="alert('Shop coming soon')"><div class="ico" style="background:#06b6d4">🛒</div><span>Shop</span></div>
<div class="app" onclick="openApp('settings')"><div class="ico" style="background:#16a34a">⚙️</div><span>Settings</span></div>
</div>
<div id="app-track" class="app-window"><div class="win-header"><b>📍 My Location</b><button onclick="closeApps()" style="padding:6px 12px;border-radius:8px;border:0">✕</button></div><div id="map"></div><div style="padding:10px"><button onclick="sendSOS()" style="width:100%;padding:14px;border-radius:12px;background:#ef4444;color:#fff;border:0;font-weight:800">🚨 SEND SOS - PATROLLER COMES</button></div></div>
<div id="app-patrols" class="app-window"><div class="win-header"><b>🚓 Nearby Patrollers Live</b><button onclick="closeApps()" style="padding:6px 12px;border-radius:8px;border:0">✕</button></div><div id="patrolList" style="padding:12px;overflow-y:auto;flex:1"></div></div>
<div id="app-radio" class="app-window"><div class="win-header"><b>📻 Radio</b><button onclick="closeApps()" style="padding:6px 12px;border-radius:8px;border:0">✕</button></div><div style="padding:20px;text-align:center">Talk to patroller</div></div>
<div id="app-settings" class="app-window"><div class="win-header"><b>⚙️ Settings</b><button onclick="closeApps()" style="padding:6px 12px;border-radius:8px;border:0">✕</button></div><div style="padding:20px" id="settingsBox"></div></div>
</div>
<script>
document.getElementById('uEmail').innerText=auth.email;
function openApp(n){document.querySelectorAll('.app-window').forEach(w=>w.classList.remove('open')); document.getElementById('app-'+n).classList.add('open'); setTimeout(()=>map&&map.invalidateSize(),300);}
function closeApps(){document.querySelectorAll('.app-window').forEach(w=>w.classList.remove('open'))}
let map=L.map('map',{zoomControl:false}).setView([-25.60215,27.9799],16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22}).addTo(map);
let me=null, myLat=-25.60215, myLng=27.9799;
function updatePos(p){myLat=p.coords.latitude; myLng=p.coords.longitude; if(!me) me=L.marker([myLat,myLng]).addTo(map); else me.setLatLng([myLat,myLng]); map.setView([myLat,myLng],17); saveLoc();}
navigator.geolocation.watchPosition(updatePos,()=>{},{enableHighAccuracy:true});
function saveLoc(){let addr=localStorage.getItem('zondi_address')||'Ga-Rankuwa'; let shop=localStorage.getItem('zondi_shopname')||auth.email; fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneId:auth.email,address:addr,name:shop,lat:myLat,lng:myLng,type:'LOCATION_UPDATE'})});}
function sendSOS(){saveLoc(); fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneId:auth.email,address:localStorage.getItem('zondi_address'),name:localStorage.getItem('zondi_shopname'),lat:myLat,lng:myLng,type:'🚨 SOS PANIC'})}).then(()=>alert('🚨 SOS Sent! Patrollers will see you - 3km away')); openApp('patrols'); loadPatrols();}
async function loadPatrols(){let res=await fetch('/api/patrollers-live'); let data=await res.json(); function dist(a,b,c,d){let R=6371; let dLat=(c-a)*Math.PI/180; let dLon=(d-b)*Math.PI/180; let x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));} let html=data.map(p=>{let d=dist(myLat,myLng,p.lat,p.lng); return `<div style="padding:12px;border:1px solid #eee;border-radius:12px;margin-bottom:8px"><b>🚓 ${p.name||p.email}</b><br><span style="font-size:12px;color:#666">📍 ${d.toFixed(2)}km away - ${d<3?'✅ NEAR YOU':''}</span><br><a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="color:#2563eb;font-size:12px">View on Map</a></div>`}).join('')||'No patrollers live - patroller must open /patrollers'; document.getElementById('patrolList').innerHTML=html; document.getElementById('settingsBox').innerHTML=`Name: ${localStorage.getItem('zondi_shopname')}<br>Email: ${auth.email}<br>Address: ${localStorage.getItem('zondi_address')}<br>Lat: ${myLat.toFixed(5)} Lng: ${myLng.toFixed(5)}`;}
setInterval(loadPatrols,5000); loadPatrols();
setTimeout(()=>map.invalidateSize(),800);
</script>
</body></html>
