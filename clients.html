<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:20px}button{padding:12px 18px;border-radius:8px;border:0;background:#ef4444;color:#fff;font-weight:bold}#map{height:60vh;background:#1e293b;border-radius:12px;margin-top:15px;display:flex;align-items:center;justify-content:center}</style></head><body><h2>Client Dashboard</h2><p id="u"></p><button id="sos">🚨 SEND SOS</button><div id="map">Map / Location tracking active</div>
<script>
let t=localStorage.getItem('zondi_token');if(!t)location='/login';fetch('/api/me',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(j=>{if(!j.ok)location='/login';u.textContent=j.user.name+' - '+j.user.role});
navigator.geolocation.watchPosition(p=>{fetch('/api/location/update',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('zondi_token')},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})})});
sos.onclick=()=>{navigator.geolocation.getCurrentPosition(p=>{fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})}).then(()=>alert('SOS Sent!'));})};
</script></body></html>
