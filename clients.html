<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;background:#fff;font-family:system-ui}
#map{height:75vh;width:100%;background:#eee;display:block}
.leaflet-tile-pane{filter:none!important}
.leaflet-tile{filter:none!important;mix-blend-mode:normal!important}
</style>
</head>
<body style="background:#fff">
<div style="padding:12px;background:#fff;border-bottom:1px solid #eee">
<b>ZONDI - Client</b> <span style="font-size:10px;background:#dcfce7;color:#16a34a;padding:3px 8px;border-radius:10px">CLEAN v2.2</span>
<p style="font-size:11px;color:#666;margin:4px 0">Drag red pin to exact gate if 4408 wrong → SAVE</p>
<button onclick="saveFix()" style="width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:700">SAVE MY CORRECT HOUSE</button>
<div id="status" style="font-size:12px;color:green;margin-top:6px"></div>
</div>
<div id="map"></div>
<script>
var map = L.map('map').setView([-25.60855,27.98021],18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20}).addTo(map);
var pin=null, pos=null;
function init(){
 navigator.geolocation.getCurrentPosition(p=>{
  var lat = p.coords.latitude, lng = p.coords.longitude;
  var fix = JSON.parse(localStorage.getItem('zondi_corrected_pin')||'null');
  if(fix){lat=fix.lat;lng=fix.lng}
  pos={lat:lat,lng:lng};
  map.setView([lat,lng],19);
  if(pin) map.removeLayer(pin);
  pin=L.marker([lat,lng],{draggable:true}).addTo(map).bindPopup("Drag me").openPopup();
  pin.on('dragend',e=>{var ll=e.target.getLatLng();pos={lat:ll.lat,lng:ll.lng};document.getElementById('status').innerText="New: "+ll.lat.toFixed(6)+" - Press SAVE"});
 },null,{enableHighAccuracy:true});
}
function saveFix(){
 if(!pos) return alert("Wait GPS");
 localStorage.setItem('zondi_corrected_pin',JSON.stringify(pos));
 var auth=JSON.parse(localStorage.getItem('zondi_auth')||'{}');
 fetch('/api/sos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:auth.email||'client',lat:pos.lat,lng:pos.lng,address:pos.lat+','+pos.lng,corrected:true})})
 .then(()=>{document.getElementById('status').innerText="✅ SAVED! No more wrong house"});
}
init();
</script>
</body>
</html>
