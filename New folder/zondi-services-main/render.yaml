services:
  - type: web
    name: zondi-radio-1
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:$PORT zondi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEV_PORTAL_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
