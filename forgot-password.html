<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Forgot Password</title><link rel="stylesheet" href="/assets/zondi-theme.css"></head><body><div class="center"><section class="panel auth-card">
<div class="auth-logo"><img src="/assets/zondi-logo.png" alt="Zondi"></div><div class="auth-title">Reset access</div><div class="auth-sub">Enter your Zondi email and we'll create a protected reset request.</div>
<div id="status" class="status hidden" aria-live="polite"></div><form id="forgot"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
<button id="btn" class="btn primary block">Request password reset</button></form>
<div class="notice" style="margin-top:13px">For safety, this screen never reveals whether an email is registered. A Developer/Admin processes the reset request.</div>
<div class="row" style="justify-content:center;margin-top:14px"><a class="link mini" href="/login">← Back to login</a><a class="link mini" href="/">Home</a></div>
<footer class="footer" style="padding-bottom:4px">Designed by <span class="gold">G.V Mkhwanazi™</span></footer>
</section></div>
<script>
const $=id=>document.getElementById(id),statusEl=$('status'),btn=$('btn');const msg=(t,c='')=>{statusEl.hidden=false;statusEl.className='status '+c;statusEl.textContent=t};
$('forgot').onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending request…';try{
const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim()})});
let d={};try{d=await r.json()}catch{throw Error('Server returned an invalid response.')};if(!r.ok||!d.ok)throw Error(d.error||'Unable to create reset request.');msg(d.message||'Reset request created.','ok');$('email').value='';
}catch(e){msg(e.message,'err')}finally{btn.disabled=false;btn.textContent='Request password reset'}};
</script></body></html>
