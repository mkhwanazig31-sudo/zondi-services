<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding-top:80px}form{background:#1e293b;padding:30px;border-radius:12px;width:320px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0;background:#0f172a;color:#fff}button{width:100%;padding:12px;background:#22c55e;border:0;border-radius:8px}</style></head><body><form id="f"><h3>Forgot Password</h3><input id="email" placeholder="Email"><button>Request Reset</button><p id="msg"></p></form><script>f.onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});let j=await r.json();msg.textContent=j.message;};</script></body></html>
