<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot - Zondi</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:8px}.btn{width:100%;padding:14px;border-radius:999px;background:#f5c518;border:none;font-weight:700;margin-top:12px}</style></head>
<body><h2>Reset password</h2><p style="color:#666;font-size:12px">Enter your email, we will notify developer</p><input id="email" placeholder="you@example.com"><button class="btn" onclick="send()">Request reset</button><div style="margin-top:12px"><a href="/login" style="color:#888">Back to login</a></div>
<script>async function send(){ const email=document.getElementById('email').value; const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}); const j=await r.json(); alert(j.message||'Request sent'); location.href='/login'; }</script></body></html>
