<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Register</title>
<link rel="stylesheet" href="/assets/zondi-theme.css">
</head>
<body>
<div class="center">
<div class="panel panel-pad auth-card">
  <b style="font-size:20px">Create account</b>
  <div id="status" class="status hidden" style="margin-top:12px"></div>
  <div style="margin-top:14px">
    <input id="name" placeholder="Full name" style="width:100%;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
    <input id="email" placeholder="Email" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
    <input id="password" type="password" placeholder="Password (min 6)" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
    <select id="role" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#0f0f0f;border:1px solid #222;color:#fff">
      <option value="client">Client — I need protection</option>
      <option value="patroller">Patroller — I provide protection (needs approval)</option>
    </select>
    <button id="regBtn" class="btn primary" style="width:100%;margin-top:12px">Create account</button>
    <div class="row-between" style="margin-top:10px"><a class="mini" href="/login">Already have account?</a><span class="mini">Patroller = manual approval</span></div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
function msg(t,c=''){let s=$('status');s.hidden=false;s.textContent=t;s.className='status '+c}
$('regBtn').onclick=async()=>{
  const name=$('name').value.trim(); const email=$('email').value.trim().toLowerCase(); const password=$('password').value; const role=$('role').value;
  if(!name||!email||!password) return msg('Fill all fields','err');
  if(password.length<6) return msg('Password too short','err');
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role})});
    const d=await r.json(); if(!r.ok||!d.ok) throw Error(d.error||'Register failed');
    if(d.needs_approval){ msg('Account created — awaiting patroller approval. Try login after approval.','warn'); }
    else{ localStorage.setItem('zondi_token',d.token); sessionStorage.setItem('zondi_token',d.token); localStorage.setItem('zondi_user',JSON.stringify(d.user)); sessionStorage.setItem('zondi_user',JSON.stringify(d.user)); document.cookie=`zondi_token=${d.token}; path=/; max-age=604800`; location.href=d.user.role==='client'?'/clients':'/patrol'; }
  }catch(e){ msg(e.message,'err'); }
}
</script>
</body>
</html>
