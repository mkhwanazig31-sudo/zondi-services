<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Zondi</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding-top:40px}form{background:#1e293b;padding:30px;border-radius:12px;width:340px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#0f172a;color:#fff}button{width:100%;padding:12px;background:#22c55e;border:0;border-radius:8px;font-weight:bold}</style></head><body>
<form id="f"><h2>Register</h2><input id="name" placeholder="Full Name" required><input id="email" placeholder="Email" required><input id="phone" placeholder="Phone"><select id="role"><option value="client">Client</option><option value="patroller">Patroller</option></select><input id="password" type="password" placeholder="Password 6+ chars" required><button>Register</button><p id="msg"></p></form>
<script>
f.onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,role:role.value,password:password.value})});let j=await r.json();msg.textContent=j.error||j.message||'Done';if(j.token){localStorage.setItem('zondi_token',j.token);location='/clients';} if(j.ok&&role.value==='patroller'){msg.textContent='Patroller pending approval - contact admin';}}
</script></body></html>
