<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zondi — Create Account</title><link rel="stylesheet" href="/assets/zondi-theme.css"></head><body><div class="center"><section class="panel auth-card">
<div class="auth-logo"><img src="/assets/zondi-logo.png" alt="Zondi"></div><div class="auth-title">Create your account</div><div class="auth-sub">Fast setup. Only the essentials are required.</div>
<div id="status" class="status hidden" aria-live="polite"></div><form id="reg">
<div class="field"><label>Choose your account</label><div class="role-grid">
<label class="role-choice active"><input type="radio" name="role" value="client" checked><b>📱 Client</b><span>Personal protection and SOS.</span></label>
<label class="role-choice"><input type="radio" name="role" value="patroller"><b>🚓 Patroller</b><span>Developer approval required.</span></label></div></div>
<div class="field"><label>Full name</label><input id="name" required autocomplete="name" placeholder="Your full name"></div>
<div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="show-pass" id="show">Show</button></div>
<div class="strength"><i id="strengthBar"></i></div><div class="mini" id="strengthText">Use 8+ characters with a mix of letters and numbers.</div></div>
<details style="margin:8px 0 14px"><summary class="mini" style="cursor:pointer">Add phone number (optional)</summary><div class="field" style="margin-top:12px;margin-bottom:0"><label>Phone</label><input id="phone" autocomplete="tel" placeholder="+27 …"></div></details>
<button id="submitBtn" class="btn primary block">Create account</button></form>
<div class="notice" style="margin-top:13px">Your password is stored as a secure hash. Zondi never shows it back to you.</div>
<div style="text-align:center;margin-top:13px"><a class="link mini" href="/login">Already have an account? Sign in</a></div>
<footer class="footer" style="padding-bottom:4px">Designed by <span class="gold">G.V Mkhwanazi™</span></footer>
</section></div>
<script>
const $=id=>document.getElementById(id),form=$('reg'),statusEl=$('status'),bar=$('strengthBar'),strengthText=$('strengthText');
const msg=(t,c='')=>{statusEl.hidden=false;statusEl.className='status '+c;statusEl.textContent=t};
$('show').onclick=()=>{const i=$('password'),show=i.type==='password';i.type=show?'text':'password';$('show').textContent=show?'Hide':'Show'};
document.querySelectorAll('.role-choice input').forEach(r=>r.addEventListener('change',()=>document.querySelectorAll('.role-choice').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked))));
$('password').addEventListener('input',()=>{const v=$('password').value;let score=0;if(v.length>=8)score++;if(v.length>=12)score++;if(/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;bar.style.width=Math.min(score,5)*20+'%';strengthText.textContent=score<3?'Add more length and a number for a stronger password.':score<5?'Good password — a symbol can make it stronger.':'Strong password.'});
form.onsubmit=async e=>{e.preventDefault();const role=document.querySelector('input[name="role"]:checked').value;if($('password').value.length<8){msg('Use at least 8 characters for your password.','err');return}
$('submitBtn').disabled=true;$('submitBtn').textContent='Creating account…';try{
const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role,name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),password:$('password').value})});
let d={};try{d=await r.json()}catch{throw Error('Server returned an invalid response.')};if(!r.ok||!d.ok)throw Error(d.error||'Registration failed');$('password').value='';
if(d.user?.role==='patroller'){msg('Account created. Your patroller access is waiting for Developer approval.','warn');setTimeout(()=>location.href='/login',1800)}
else{msg('Account created. Redirecting to sign in…','ok');setTimeout(()=>location.href='/login',900)}
}catch(e){msg(e.message,'err')}finally{$('submitBtn').disabled=false;$('submitBtn').textContent='Create account'}};
</script></body></html>
