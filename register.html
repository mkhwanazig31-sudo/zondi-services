<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Zondi</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:8px}.btn{width:100%;padding:14px;border-radius:999px;border:none;font-weight:700;margin-top:12px;background:#f5c518;cursor:pointer}</style></head>
<body><div style="text-align:center"><div style="width:70px;height:70px;background:#111;border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center">🛡️</div><h2>Create account</h2><p style="color:#666;font-size:12px">Join Zondi response network</p></div>
<input id="name" placeholder="Full name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone"><select id="role"><option value="client">Client</option><option value="patroller">Patroller</option></select><input id="password" type="password" placeholder="Password (6+ chars)"><button class="btn" onclick="reg()">Create account</button><div style="text-align:center;margin-top:10px"><a href="/login" style="color:#888;font-size:12px">Already have account? Sign in</a></div>
<script>
async function reg(){
 const body={name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,role:document.getElementById('role').value,password:document.getElementById('password').value};
 const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json();
 if(!j.ok) return alert(j.error||j.message); if(j.token){ localStorage.setItem('zondi_token',j.token); location.href='/clients'; } else { alert(j.message); location.href='/login'; }
}
</script></body></html>
