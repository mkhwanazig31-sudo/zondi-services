<!DOCTYPE html><html><head><title>Zondi Register</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font-family:system-ui;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px} .card{width:100%;max-width:400px;background:#fff;padding:22px;border-radius:24px} input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin-top:10px;box-sizing:border-box} button{width:100%;padding:14px;border-radius:12px;border:0;background:#111;color:#fff;margin-top:14px;font-weight:800} .role{display:flex;gap:8px;margin-top:12px} .role button{flex:1;background:#f1f5f9;color:#111;border:1px solid #ddd} .role button.active{background:#111;color:#fff}</style></head><body>
<div class="card">
<h2 style="margin:0">🛡️ Create Account</h2><p style="font-size:12px;color:#666">Zondi Services - Client or Patroller</p>
<input id="name" placeholder="Full Name - e.g. Kabelo">
<input id="email" placeholder="Email - e.g. kabelo@gmail.com">
<input id="phone" placeholder="Phone - e.g. 0712345678">
<input id="address" placeholder="Address - e.g. 8643 Motsatsi Rd, Ga-Rankuwa">
<input id="password" type="password" placeholder="Password">
<input id="password2" type="password" placeholder="Confirm Password">
<div class="role"><button id="btnClient" class="active" onclick="setRole('client')">📱 Client</button><button id="btnPat" onclick="setRole('patroller')">🚓 Patroller</button></div>
<button onclick="register()">Register</button>
<p style="font-size:12px;text-align:center;margin-top:12px">Already have account? <a href="/login">Login</a></p>
<div id="msg" style="font-size:12px;color:#e11d48;margin-top:10px;text-align:center"></div>
</div>
<script>
let role='client';
function setRole(r){role=r; document.getElementById('btnClient').classList.toggle('active',r=='client'); document.getElementById('btnPat').classList.toggle('active',r=='patroller');}
async function register(){
 let name=document.getElementById('name').value.trim();
 let email=document.getElementById('email').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let address=document.getElementById('address').value.trim();
 let p1=document.getElementById('password').value;
 let p2=document.getElementById('password2').value;
 let msg=document.getElementById('msg');
 if(!name||!email||!p1){msg.innerText='Fill all required fields'; return;}
 if(p1!=p2){msg.innerText='Passwords do not match'; return;}
 if(p1.length<4){msg.innerText='Password too short (min 4)'; return;}
 let data={name,email,phone,address,password:p1,role,phoneId:email};
 try{
  let res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  let j=await res.json();
  if(!res.ok){msg.innerText=j.error||'Failed'; return;}
  // save locally too
  localStorage.setItem('zondi_auth',JSON.stringify({email,name,role}));
  localStorage.setItem('zondi_address',address);
  localStorage.setItem('zondi_shopname',name);
  localStorage.setItem('zondi_phone',phone);
  alert('Account created! Now login');
  location.href='/login';
 }catch(e){msg.innerText='Server error - try again';}
}
</script>
</body></html>
